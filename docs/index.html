<title>Circuit Bench</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2128; --muted: #5d6673; --line: #d8dde3; --soft: #eef1f4;
  --accent: #1f6feb; --accent-ink: #ffffff; --ok: #1a7f37; --warn: #9a6700; --fail: #cf222e;
  --ok-bg: #dafbe1; --warn-bg: #fff8c5; --fail-bg: #ffebe9;
  --stage: #fbfbf8; --grid: #d9dcd2; --sel: #1f6feb; --wblack: #24292f;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117; --panel: #161b22; --ink: #e6edf3; --muted: #9198a1; --line: #30363d; --soft: #21262d;
    --accent: #4493f8; --accent-ink: #0d1117; --ok: #3fb950; --warn: #d29922; --fail: #f85149;
    --ok-bg: #12261a; --warn-bg: #2a2110; --fail-bg: #2d1416;
    --stage: #1b2028; --grid: #2c333d; --sel: #4493f8; --wblack: #8b949e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117; --panel: #161b22; --ink: #e6edf3; --muted: #9198a1; --line: #30363d; --soft: #21262d;
  --accent: #4493f8; --accent-ink: #0d1117; --ok: #3fb950; --warn: #d29922; --fail: #f85149;
  --ok-bg: #12261a; --warn-bg: #2a2110; --fail-bg: #2d1416;
  --stage: #1b2028; --grid: #2c333d; --sel: #4493f8; --wblack: #8b949e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
button { background: var(--soft); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.danger { color: var(--fail); }
select, input[type=text], input[type=number] { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; min-width: 0; }
.app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; height: 100dvh; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
header .brand { font-weight: 700; margin-right: 6px; display: flex; align-items: center; gap: 6px; }
header .brand svg { width: 20px; height: 20px; }
header .grow { flex: 1; }
#simclock { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; min-width: 120px; }
.main { display: grid; grid-template-columns: 210px minmax(0, 1fr) 330px; min-height: 0; }
.panel { background: var(--panel); min-height: 0; overflow: auto; }
#shelfPanel { border-right: 1px solid var(--line); padding: 8px; }
#sidePanel { border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.shelf input { width: 100%; margin-bottom: 6px; }
.shelf h4 { margin: 10px 2px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.shelf .item { display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent; padding: 4px 6px; border-radius: 6px; overflow: hidden; text-overflow: ellipsis; }
.shelf .item:hover { background: var(--soft); border-color: var(--line); }
.tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; }
.tabs button { border: none; border-radius: 0; background: none; padding: 8px 8px; font-size: 13.5px; border-bottom: 2px solid transparent; color: var(--muted); }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tabs .count { display: inline-block; min-width: 16px; padding: 0 4px; border-radius: 8px; font-size: 11px; margin-left: 4px; background: var(--soft); }
.tabs .count.fail { background: var(--fail); color: #fff; } .tabs .count.warn { background: var(--warn); color: #fff; }
.tabbody { padding: 10px 12px; overflow: auto; flex: 1; min-height: 0; overflow-wrap: anywhere; }
.stage { position: relative; overflow: hidden; background-color: var(--stage); touch-action: none; user-select: none; -webkit-user-select: none; min-height: 0; }
.stage.wiring { cursor: crosshair; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.part { position: absolute; z-index: 1; transform-origin: center; line-height: 0; cursor: grab; }
.part > .body { display: inline-block; }
.part > .body > * { display: inline-block; pointer-events: none; }
.part.live > .body > * { pointer-events: auto; cursor: pointer; }
.part.sel { outline: 2px dashed var(--sel); outline-offset: 4px; border-radius: 3px; }
.tag { position: absolute; z-index: 2; font: 600 10px/1 system-ui, sans-serif; color: var(--muted); white-space: nowrap; pointer-events: none; }
.part .badge { position: absolute; right: -8px; top: -8px; width: 16px; height: 16px; border-radius: 50%; color: #fff; font: 700 11px/16px system-ui, sans-serif; text-align: center; pointer-events: none; }
.part .badge.fail { background: var(--fail); box-shadow: 0 0 0 4px #cf222e44; }
.part .badge.warn { background: var(--warn); }
.part.burnt { filter: grayscale(.6) brightness(.7); }
#wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 3; }
#wires .w { fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; pointer-events: stroke; cursor: pointer; }
#wires .wo { fill: none; stroke: #0006; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
#wires .w.sel { stroke-dasharray: 6 4; }
#wires .wsel { fill: none; stroke: var(--sel); stroke-width: 9; stroke-opacity: .35; stroke-linecap: round; stroke-linejoin: round; }
#wires .pin { fill: transparent; stroke: transparent; pointer-events: all; cursor: crosshair; }
#wires .pin:hover, .wiring #wires .pin { stroke: #1f9e3a; stroke-width: 1.5; fill: #1f9e3a33; }
#wires .pin:hover { fill: #1f9e3a88; }
#wires .draft { fill: none; stroke: #1f9e3a; stroke-width: 3; stroke-dasharray: 5 4; }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 4px; }
.zoom button { width: 34px; height: 34px; padding: 0; background: var(--panel); }
.hint { position: absolute; left: 10px; bottom: 10px; max-width: calc(100% - 140px); font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; pointer-events: none; }
#tip { position: fixed; z-index: 20; pointer-events: none; background: #1c2128; color: #fff; font-size: 12px; padding: 3px 7px; border-radius: 5px; max-width: 320px; }
.toast { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 6px 12px; border-radius: 6px; font-size: 13px; pointer-events: none; z-index: 5; }
h3 { margin: 0 0 6px; font-size: 15px; }
.sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
.form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 6px 8px; align-items: center; margin: 10px 0; }
.form label { color: var(--muted); font-size: 13px; }
.form input[type=range] { width: 100%; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
td, th { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
#readings th, #pinTable th { white-space: nowrap; width: 1%; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.verdict { border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; font-weight: 600; }
.verdict small { display: block; font-weight: 400; color: var(--muted); margin-top: 2px; }
.verdict.ok { background: var(--ok-bg); color: var(--ok); } .verdict.warn { background: var(--warn-bg); color: var(--warn); } .verdict.fail { background: var(--fail-bg); color: var(--fail); } .verdict.idle { background: var(--soft); }
.issue { border-left: 3px solid var(--line); padding: 6px 8px; margin: 6px 0; background: var(--soft); border-radius: 0 6px 6px 0; cursor: pointer; }
.issue.fail { border-left-color: var(--fail); } .issue.warn { border-left-color: var(--warn); }
.issue b { font-weight: 600; } .issue .fix { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.serial { background: #0d1117; color: #c9d1d9; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; padding: 8px; border-radius: 6px; height: 260px; overflow: auto; white-space: pre-wrap; }
.swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); padding: 0; }
.swatch.on { border-color: var(--ink); }
a { color: var(--accent); }
.muted { color: var(--muted); }
.menu { position: relative; }
.menu > div { position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px #0003; padding: 4px; min-width: 240px; }
.menu > div button { display: block; width: 100%; text-align: left; border: none; background: none; padding: 6px 10px; }
.menu > div button:hover { background: var(--soft); }
.menu > div hr { border: none; border-top: 1px solid var(--line); margin: 4px 0; }
.kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.grp-btn { display: inline-flex; }
.grp-btn button { border-radius: 0; margin-left: -1px; }
.grp-btn button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.grp-btn button:last-child { border-radius: 0 6px 6px 0; }
button:disabled { opacity: .45; cursor: default; }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--soft); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.run { background: var(--ok-bg); color: var(--ok); }
.pill.pause { background: var(--warn-bg); color: var(--warn); }
#selbar { position: absolute; left: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; box-shadow: 0 2px 10px #0002; z-index: 4; max-width: calc(100% - 20px); font-size: 13px; }
#selbar b { font-weight: 600; }
#selbar button { padding: 3px 8px; }
#guidebar { position: absolute; left: 50%; transform: translateX(-50%); bottom: 54px; width: min(560px, calc(100% - 20px)); background: var(--panel); border: 2px solid var(--accent); border-radius: 10px; padding: 8px 10px; box-shadow: 0 4px 16px #0003; z-index: 4; font-size: 13.5px; }
#guidebar .gstep { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); font-weight: 700; }
#guidebar .row { margin-top: 6px; }
#legend { position: absolute; right: 10px; bottom: 52px; font-size: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; color: var(--muted); z-index: 4; pointer-events: none; }
#wires .flow { fill: none; stroke: #ffd33d; stroke-width: 3.2; stroke-linecap: round; stroke-dasharray: 0.1 14; pointer-events: none; filter: drop-shadow(0 0 1.5px #000a); }
#wires .flow.e { stroke: #79c0ff; }
#wires .w.hl { stroke-width: 5; }
#wires .wo.hl { stroke: #ffd33d99; stroke-width: 9; }
#wires .h { fill: var(--panel); stroke: var(--sel); stroke-width: 2; pointer-events: all; cursor: move; }
#wires .h.end { fill: var(--sel); cursor: grab; }
#wires .h.mid { fill: var(--panel); stroke-dasharray: 2 2; opacity: .8; cursor: copy; }
#wires .pin.target { stroke: #f0b400; stroke-width: 2.5; fill: #f0b40055; animation: pulse 1s ease-in-out infinite; }
#wires .pin.near { stroke: #1f9e3a; stroke-width: 3; fill: #1f9e3aaa; }
@keyframes pulse { 50% { r: 7; } }
.shelf .item.target { background: #f0b40033; border-color: #f0b400; font-weight: 600; }
button.pulse { animation: glow 1.2s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 5px #f0b40088; } }
.part.target { outline: 3px solid #f0b400; outline-offset: 6px; border-radius: 4px; }
.steps { list-style: none; padding: 0; margin: 8px 0; }
.steps li { display: flex; gap: 8px; padding: 6px 8px; border-radius: 6px; align-items: flex-start; }
.steps li .ck { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); font-size: 11px; line-height: 14px; text-align: center; }
.steps li.done { color: var(--muted); }
.steps li.done .ck { background: var(--ok); border-color: var(--ok); color: #fff; }
.steps li.cur { background: var(--soft); outline: 1px solid var(--accent); }
.steps li.cur .ck { border-color: var(--accent); }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 8px 0; }
.card h4 { margin: 0 0 4px; font-size: 13.5px; }
.next li { margin: 4px 0; }
.code { background: #0d1117; color: #c9d1d9; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; padding: 8px 10px; border-radius: 6px; overflow: auto; max-height: 60vh; white-space: pre; margin: 0; }
.code .ln { display: inline-block; width: 30px; color: #6e7681; text-align: right; margin-right: 10px; user-select: none; }
.c-com { color: #8b949e; font-style: italic; } .c-str { color: #a5d6ff; } .c-pre { color: #ff7b72; } .c-num { color: #79c0ff; } .c-kw { color: #ff7b72; } .c-fn { color: #d2a8ff; }
.phonewrap { display: flex; flex-direction: column; }
.phone { position: relative; width: 100%; max-width: 300px; margin: 0 auto; border: 10px solid #1b1f24; border-radius: 28px; background: #111; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
.phone .pbar { display: flex; justify-content: space-between; gap: 6px; font: 11px/1 system-ui, sans-serif; color: #ccc; background: #1b1f24; padding: 4px 8px 6px; }
.phone iframe { display: block; width: 100%; height: 420px; border: 0; background: #111; }
.phone .pover { position: absolute; inset: 21px 0 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; color: #ddd; background: #111; font-size: 14px; line-height: 1.5; }
.phone .pover[hidden] { display: none; }
.phonewrap label.field { display: block; margin: 4px 0; font-size: 12.5px; }
table.live { width: 100%; font-size: 12.5px; margin-top: 6px; }
table.live th { text-align: left; padding-right: 8px; white-space: nowrap; vertical-align: top; }
.editor { position: relative; height: 60vh; min-height: 280px; border-radius: 6px; overflow: hidden; background: #0d1117; }
.editor pre.code { position: absolute; inset: 0; max-height: none; overflow: hidden; border-radius: 0; pointer-events: none; }
.editor pre.code code { display: block; will-change: transform; }
.editor textarea { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; border: 0; border-radius: 0; resize: none; outline: none;
  font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; padding: 8px 10px 8px 50px; white-space: pre; overflow: auto; tab-size: 2;
  background: transparent; color: transparent; caret-color: #fff; -webkit-text-fill-color: transparent; }
.editor textarea::selection { background: rgba(56, 139, 253, .4); -webkit-text-fill-color: transparent; }
.editor textarea:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.code .ln.fail { background: #da3633; color: #fff; border-radius: 3px; }
.code .ln.warn { background: #9e6a03; color: #fff; border-radius: 3px; }
.codestatus { font-size: 12.5px; margin: 4px 0 6px; }
.codestatus:empty { display: none; }
.codestatus .good { color: var(--ok); font-weight: 600; } .codestatus .bad { color: var(--fail, #d1242f); font-weight: 600; }
.codestatus ul.errs { list-style: none; margin: 4px 0 0; padding: 0; max-height: 140px; overflow: auto; }
.codestatus button.link { background: none; border: 0; padding: 2px 0; text-align: left; font: 12px ui-monospace, Menlo, Consolas, monospace; cursor: pointer; color: var(--ink, inherit); }
.codestatus button.link.fail::before { content: '✗ '; color: #d1242f; } .codestatus button.link.warn::before { content: '⚠ '; color: #9e6a03; }
.codestatus button.link:hover { text-decoration: underline; }
.graphbox { border: 1px solid var(--line); border-radius: 8px; padding: 6px 4px 2px; background: var(--panel); }
.graphbox canvas { display: block; width: 100%; }
.stage.picking, .stage.picking * { cursor: crosshair !important; }
table.projects { width: 100%; } table.projects td { padding: 6px 4px; border-bottom: 1px solid var(--line); } table.projects tr.cur td { background: var(--soft); }
.pindesc { font-size: 12px; color: var(--muted); }
@media (max-width: 860px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100dvh; }
  .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 58vh auto; }
  #shelfPanel { display: none; }
  #sidePanel { border-left: none; border-top: 1px solid var(--line); min-height: 50vh; }
  .tabbody { overflow: visible; }
  #simclock { min-width: 0; }
  header .brand span { display: none; }
  .hint { display: none; }
  #legend { display: none; }
  #guidebar { bottom: 50px; }
  #speed, #flowSel { max-width: 120px; }
  .grp-btn button { padding: 5px 8px; }
}
</style>

<div class="app">
  <header>
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 1v4M15 1v4M9 19v4M15 19v4M1 9h4M1 15h4M19 9h4M19 15h4"/></svg><span>Circuit Bench</span></div>
    <input type="text" id="projName" aria-label="Project name" style="width:170px">
    <div class="grp-btn" role="group" aria-label="Simulation">
      <button id="runBtn" class="primary" title="Run the circuit (Space)">▶ Run</button>
      <button id="stopBtn" title="Stop and reset the simulation">■ Stop</button>

    <span id="simclock" class="pill">Stopped</span>
    <select id="speed" aria-label="Simulation speed" title="Simulation speed"><option value="0.25">¼× speed</option><option value="1" selected>1× speed</option><option value="4">4× speed</option></select>
    <div class="grp-btn" role="group" aria-label="History">
      <button id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo">↶ Undo</button>
      <button id="redoBtn" title="Redo (Ctrl+Y)" aria-label="Redo">↷ Redo</button>
    </div>
    <select id="flowSel" aria-label="Show current flow" title="Moving dots show current in every wire while running">
      <option value="electrons" selected>Flow: electrons</option>
      <option value="current">Flow: current</option>
      <option value="off">Flow: off</option>
    </select>
    <span class="grow"></span>
    <div class="menu"><button id="exBtn">Examples ▾</button><div id="exMenu" hidden></div></div>
    <div class="menu"><button id="fileBtn">File ▾</button><div id="fileMenu" hidden>
      <button data-act="projects">My projects…</button>
      <button data-act="new">New empty circuit</button>
      <button data-act="open">Open project (.json)…</button>
      <button data-act="save">Save project (.json)</button>
      <hr>
      <button data-act="wokwi-in">Import Wokwi diagram.json…</button>
      <button data-act="wokwi-out">Export Wokwi diagram.json</button>
      <hr>
      <button data-act="help">How to use</button>
      <button data-act="keys">Keyboard shortcuts</button>
    </div></div>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
    <input type="file" id="wasmIn" accept=".wasm" hidden>
  </header>
  <div class="main">
    <aside class="panel" id="shelfPanel"></aside>
    <section class="stage" id="stage">
      <div id="world"><svg id="wires" width="1" height="1"></svg></div>
      <div class="hint" id="hint"></div>
      <div id="selbar" hidden></div>
      <div id="guidebar" hidden></div>
      <div id="legend" hidden></div>
      <div class="zoom"><button id="zOut" aria-label="Zoom out">−</button><button id="zFit" aria-label="Fit">⤢</button><button id="zIn" aria-label="Zoom in">+</button></div>
      <div class="toast" id="toast" hidden></div>
    </section>
    <aside class="panel" id="sidePanel">
      <div class="tabs" id="tabs"></div>
      <div class="tabbody" id="tabBody"></div>
    </aside>
  </div>
</div>
<div id="tip" hidden></div>

globalThis.SKETCH_SRC = {"blink":"// Blink: an LED on LED_PIN turns on and off every half second.\n// ESP32: GPIO2 (also the on-board blue LED). Uno: pin 13.\n#ifdef BOARD_UNO\nconst int LED_PIN = 13;\n#else\nconst int LED_PIN = 2;\n#endif\n\nvoid setup() {\n  Serial.begin(115200);\n  pinMode(LED_PIN, OUTPUT);\n  Serial.println(\"Blink started\");\n}\n\nvoid loop() {\n  digitalWrite(LED_PIN, HIGH);\n  delay(500);\n  digitalWrite(LED_PIN, LOW);\n  delay(500);\n}\n","button_led":"// Button to LED: the LED is on while the button is held.\n// The button goes between BUTTON_PIN and GND; the internal pull-up keeps the pin HIGH otherwise.\n#ifdef BOARD_UNO\nconst int BUTTON_PIN = 2, LED_PIN = 13;\n#else\nconst int BUTTON_PIN = 4, LED_PIN = 2;\n#endif\n\nint last = -1;\n\nvoid setup() {\n  Serial.begin(115200);\n  pinMode(BUTTON_PIN, INPUT_PULLUP);\n  pinMode(LED_PIN, OUTPUT);\n}\n\nvoid loop() {\n  int pressed = digitalRead(BUTTON_PIN) == LOW;\n  digitalWrite(LED_PIN, pressed ? HIGH : LOW);\n  if (pressed != last) {\n    Serial.println(pressed ? \"pressed\" : \"released\");\n    last = pressed;\n  }\n  delay(10);\n}\n","distance_alarm":"// Distance alarm: HC-SR04 measures distance; LED and buzzer turn on under 20 cm.\n// ECHO is 5 V: on the ESP32 put a 1k/2k divider between ECHO and the pin.\n#ifdef BOARD_UNO\nconst int TRIG = 9, ECHO = 10, ALARM = 13;\n#else\nconst int TRIG = 4, ECHO = 34, ALARM = 2;\n#endif\n\nvoid setup() {\n  Serial.begin(115200);\n  pinMode(TRIG, OUTPUT);\n  pinMode(ECHO, INPUT);\n  pinMode(ALARM, OUTPUT);\n}\n\nvoid loop() {\n  digitalWrite(TRIG, LOW);\n  delayMicroseconds(2);\n  digitalWrite(TRIG, HIGH);\n  delayMicroseconds(10);\n  digitalWrite(TRIG, LOW);\n  unsigned long us = pulseIn(ECHO, HIGH, 30000);\n  float cm = us ? us / 58.0 : -1;\n  digitalWrite(ALARM, cm > 0 && cm < 20 ? HIGH : LOW);\n  Serial.printf(\"distance %.1f cm\\n\", cm);\n  delay(200);\n}\n","motor_mosfet":"// Motor speed: a logic-level MOSFET switches a DC motor; a pot sets the speed.\n#ifdef BOARD_UNO\nconst int POT_PIN = A0, GATE = 9, ADC_MAX = 1023;\n#else\nconst int POT_PIN = 34, GATE = 25, ADC_MAX = 4095;\n#endif\n\nvoid setup() {\n  Serial.begin(115200);\n  pinMode(GATE, OUTPUT);\n}\n\nvoid loop() {\n  int level = (long)analogRead(POT_PIN) * 255 / ADC_MAX;\n  analogWrite(GATE, level);\n  static uint32_t t = 0;\n  if (millis() - t > 400) { t = millis(); Serial.printf(\"motor %d%%\\n\", level * 100 / 255); }\n  delay(10);\n}\n","pot_dimmer":"// Pot dimmer: a potentiometer sets the brightness of an LED (PWM).\n#ifdef BOARD_UNO\nconst int POT_PIN = A0, LED_PIN = 9, ADC_MAX = 1023;\n#else\nconst int POT_PIN = 34, LED_PIN = 25, ADC_MAX = 4095;\n#endif\n\nvoid setup() {\n  Serial.begin(115200);\n  pinMode(LED_PIN, OUTPUT);\n}\n\nvoid loop() {\n  int raw = analogRead(POT_PIN);\n  int level = (long)raw * 255 / ADC_MAX;\n  analogWrite(LED_PIN, level);\n  static uint32_t lastPrint = 0;\n  if (millis() - lastPrint > 300) {\n    lastPrint = millis();\n    Serial.printf(\"pot %d -> brightness %d%%\\n\", raw, level * 100 / 255);\n  }\n  delay(5);\n}\n","servo_sweep":"// Servo sweep: the servo turns 0 -> 180 degrees and back, in 15 degree steps.\n// Uses the Servo library. Signal on GPIO18 (ESP32) or pin 9 (Uno).\n#include <Servo.h>\n\n#ifdef BOARD_UNO\nconst int SERVO_PIN = 9;\n#else\nconst int SERVO_PIN = 18;\n#endif\n\nServo servo;\nint angle = 0;\nint stepDeg = 15;\n\nvoid setup() {\n  Serial.begin(115200);\n  servo.attach(SERVO_PIN);\n  Serial.println(\"Servo sweep started\");\n}\n\nvoid loop() {\n  servo.write(angle);\n  Serial.printf(\"angle:%d\\n\", angle);\n  angle += stepDeg;\n  if (angle >= 180 || angle <= 0) stepDeg = -stepDeg;  // turn around at the ends\n  delay(150);\n}\n","traffic_light":"// Traffic light: red, green, yellow LEDs in sequence.\n#ifdef BOARD_UNO\nconst int RED = 12, YELLOW = 11, GREEN = 10;\n#else\nconst int RED = 25, YELLOW = 26, GREEN = 27;\n#endif\n\nvoid show(int r, int y, int g, const char* name, int ms) {\n  digitalWrite(RED, r);\n  digitalWrite(YELLOW, y);\n  digitalWrite(GREEN, g);\n  Serial.println(name);\n  delay(ms);\n}\n\nvoid setup() {\n  Serial.begin(115200);\n  for (int p : {RED, YELLOW, GREEN}) pinMode(p, OUTPUT);\n}\n\nvoid loop() {\n  show(1, 0, 0, \"red\", 3000);\n  show(0, 0, 1, \"green\", 3000);\n  show(0, 1, 0, \"yellow\", 1000);\n}\n","rc_car":"// RC Toy Car v1 — ESP32 DevKit V1 + TB6612FNG\n//\n// The car creates its own Wi-Fi hotspot (\"RC-Car-xxxx\"). Connect a phone or\n// laptop to it and open http://192.168.4.1 to get a joystick page.\n//\n// Board package: \"esp32\" by Espressif Systems, version 3.x (Arduino IDE\n// Boards Manager). Board: \"ESP32 Dev Module\". No extra libraries needed.\n//\n// Command protocol (also used by the simulator later):\n//   GET /drive?t=<throttle -100..100>&s=<steer -100..100>  -> JSON status\n//   GET /status                                             -> JSON status\n// Serial (115200 baud) for bench/simulation testing:\n//   d <t> <s>     e.g. \"d 50 0\" = half speed forward, \"d 0 0\" = stop\n\n#include <WiFi.h>\n#include <WebServer.h>\n\n// ---------------- Settings you may want to change ----------------\n// #define SIMULATION              // Uncomment for Wokwi: joins \"Wokwi-GUEST\" instead of making a hotspot\nconst char* AP_PASSWORD   = \"rccar1234\"; // hotspot password, at least 8 characters\nconst int   MAX_DUTY_PCT  = 70;    // caps motor power: 70% of 7.4 V ~= 5.2 V for 3-6 V TT motors\nconst uint32_t FAILSAFE_MS = 500;  // stop if no web command for this long\nconst bool  USE_ULTRASONIC = true; // set false if the HC-SR04 is not fitted\nconst int   STOP_DISTANCE_CM = 20; // refuse to drive forward when an obstacle is closer\nconst bool  INVERT_LEFT   = false; // flip if the left wheel spins the wrong way\nconst bool  INVERT_RIGHT  = false; // flip if the right wheel spins the wrong way\nconst float VBAT_DIVIDER  = (100.0 + 33.0) / 33.0; // 100k top, 33k bottom (keeps GPIO35 under 2.45 V)\n\n// ---------------- Pins (see README pin map) ----------------\nconst int PIN_PWMA = 25, PIN_AIN1 = 26, PIN_AIN2 = 27;  // left motor\nconst int PIN_PWMB = 23, PIN_BIN1 = 18, PIN_BIN2 = 19;  // right motor\nconst int PIN_STBY = 33;\nconst int PIN_TRIG = 4,  PIN_ECHO = 34;\nconst int PIN_VBAT = 35;\nconst int PIN_LED  = 2;\n\nconst int PWM_FREQ = 20000;  // 20 kHz: above hearing, so the motors don't whine\nconst int PWM_BITS = 8;      // duty 0..255\n\nWebServer server(80);\n\nint targetThrottle = 0, targetSteer = 0;\nuint32_t lastCmdMs = 0;\nbool serialHold = false;     // a serial command holds until the next one (bench testing)\nbool webActive = false;\nfloat distanceCm = -1;       // -1 = no reading\nfloat vbat = 0;\nbool blocked = false;\nint leftOut = 0, rightOut = 0;\n\nconst char INDEX_HTML[] PROGMEM = R\"rawliteral(\n<!doctype html><html><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,user-scalable=no\">\n<title>RC Car</title>\n<style>\nbody{margin:0;font-family:system-ui,sans-serif;background:#111;color:#eee;touch-action:none;\n user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px}\n#info{font-size:15px;text-align:center}\n#state{font-weight:bold}\n#pad{width:min(80vw,55vh);height:min(80vw,55vh);border-radius:50%;background:#222;border:2px solid #444;position:relative;touch-action:none}\n#knob{width:30%;height:30%;border-radius:50%;background:#2a7;position:absolute;left:35%;top:35%}\nlabel{font-size:15px}\n#stop{font-size:22px;padding:12px 48px;border:0;border-radius:10px;background:#c33;color:#fff}\nsmall{color:#888}\n</style></head><body>\n<div id=\"info\">Battery <span id=\"bat\">-</span> V &middot; Obstacle <span id=\"dist\">-</span> cm<br>\n<span id=\"state\">connecting...</span></div>\n<div id=\"pad\"><div id=\"knob\"></div></div>\n<label>Speed limit <input id=\"lim\" type=\"range\" min=\"20\" max=\"100\" value=\"60\"> <span id=\"limv\">60</span>%</label>\n<button id=\"stop\">STOP</button>\n<small>Laptop: arrow keys or W A S D. Releasing the joystick stops the car.</small>\n<script>\nconst $=id=>document.getElementById(id);\nconst pad=$('pad'),knob=$('knob'),lim=$('lim');\nlet t=0,s=0,dragging=false,keys={};\nlim.oninput=()=>{$('limv').textContent=lim.value};\nfunction place(x,y){knob.style.left=(35+x*35)+'%';knob.style.top=(35+y*35)+'%';\n const L=+lim.value;t=Math.round(-y*L);s=Math.round(x*L);}\nfunction fromEvent(e){const r=pad.getBoundingClientRect();\n let x=(e.clientX-r.left)/r.width*2-1,y=(e.clientY-r.top)/r.height*2-1;\n const m=Math.hypot(x,y);if(m>1){x/=m;y/=m;}place(x,y);}\nfunction release(){dragging=false;place(0,0);}\npad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);dragging=true;fromEvent(e);});\npad.addEventListener('pointermove',e=>{if(dragging)fromEvent(e);});\npad.addEventListener('pointerup',release);pad.addEventListener('pointercancel',release);\n$('stop').onclick=release;\nfunction keyDrive(){const y=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);\n const x=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);place(x*0.7,y);}\naddEventListener('keydown',e=>{keys[e.key]=true;keyDrive();});\naddEventListener('keyup',e=>{keys[e.key]=false;keyDrive();});\ndocument.addEventListener('visibilitychange',()=>{if(document.hidden)release();});\nlet busy=false;\nsetInterval(async()=>{if(busy)return;busy=true;\n try{const r=await fetch('/drive?t='+t+'&s='+s,{cache:'no-store'});const j=await r.json();\n  $('bat').textContent=j.vbat.toFixed(2);$('dist').textContent=j.dist<0?'-':j.dist.toFixed(0);\n  $('state').textContent=j.blocked?'OBSTACLE - forward blocked':'connected';\n  $('state').style.color=j.blocked?'#f80':'#2a7';}\n catch(e){$('state').textContent='no connection';$('state').style.color='#c33';}\n busy=false;},100);\n<\/script></body></html>\n)rawliteral\";\n\n// ---------------- Motors ----------------\n// speed: -100 (full reverse) .. 100 (full forward)\n// brake: when speed is 0, short the motor (IN1 = IN2 = HIGH) to stop fast instead of coasting.\nvoid setMotor(int pwmPin, int in1, int in2, int speed, bool invert, bool brake = false) {\n  speed = constrain(speed, -100, 100);\n  if (invert) speed = -speed;\n  int duty = abs(speed) * MAX_DUTY_PCT * 255 / 10000;\n  if (speed > 0)      { digitalWrite(in1, HIGH); digitalWrite(in2, LOW);  }\n  else if (speed < 0) { digitalWrite(in1, LOW);  digitalWrite(in2, HIGH); }\n  else if (brake)     { digitalWrite(in1, HIGH); digitalWrite(in2, HIGH); duty = 255; } // short brake (L298N needs EN high)\n  else                { digitalWrite(in1, LOW);  digitalWrite(in2, LOW);  } // coast\n  ledcWrite(pwmPin, duty);\n}\n\n// \"Arcade\" mixing: throttle moves both wheels, steer speeds one up and slows the other.\nvoid applyDrive(int throttle, int steer) {\n  blocked = USE_ULTRASONIC && distanceCm > 0 && distanceCm < STOP_DISTANCE_CM;\n  bool brake = blocked && throttle > 0;        // brake, don't coast, into an obstacle\n  if (brake) throttle = 0;                     // still allowed: reverse and turning in place\n\n  int left = throttle + steer;\n  int right = throttle - steer;\n  int biggest = max(abs(left), abs(right));\n  if (biggest > 100) {                       // keep the ratio, cap at 100\n    left = left * 100 / biggest;\n    right = right * 100 / biggest;\n  }\n  leftOut = left;\n  rightOut = right;\n  setMotor(PIN_PWMA, PIN_AIN1, PIN_AIN2, left, INVERT_LEFT, brake);\n  setMotor(PIN_PWMB, PIN_BIN1, PIN_BIN2, right, INVERT_RIGHT, brake);\n}\n\n// ---------------- Sensors ----------------\nfloat readDistanceCm() {\n  digitalWrite(PIN_TRIG, LOW);\n  delayMicroseconds(2);\n  digitalWrite(PIN_TRIG, HIGH);\n  delayMicroseconds(10);\n  digitalWrite(PIN_TRIG, LOW);\n  unsigned long us = pulseIn(PIN_ECHO, HIGH, 25000);  // 25 ms timeout ~= 4 m\n  if (us == 0) return -1;\n  return us / 58.0;\n}\n\nfloat readBatteryVolts() {\n  uint32_t mv = 0;\n  for (int i = 0; i < 8; i++) mv += analogReadMilliVolts(PIN_VBAT);\n  return (mv / 8.0) / 1000.0 * VBAT_DIVIDER;\n}\n\n// ---------------- Web handlers ----------------\nvoid sendStatus() {\n  char json[160];\n  snprintf(json, sizeof(json),\n           \"{\\\"vbat\\\":%.2f,\\\"dist\\\":%.1f,\\\"blocked\\\":%s,\\\"left\\\":%d,\\\"right\\\":%d}\",\n           vbat, distanceCm, blocked ? \"true\" : \"false\", leftOut, rightOut);\n  server.sendHeader(\"Cache-Control\", \"no-store\");\n  server.send(200, \"application/json\", json);\n}\n\nvoid handleDrive() {\n  targetThrottle = constrain(server.arg(\"t\").toInt(), -100, 100);\n  targetSteer    = constrain(server.arg(\"s\").toInt(), -100, 100);\n  lastCmdMs = millis();\n  serialHold = false;\n  webActive = true;\n  sendStatus();\n}\n\nvoid handleSerial() {\n  static String line;\n  while (Serial.available()) {\n    char c = Serial.read();\n    if (c == '\\n' || c == '\\r') {\n      int t, s;\n      if (line.length() && sscanf(line.c_str(), \"d %d %d\", &t, &s) == 2) {\n        targetThrottle = constrain(t, -100, 100);\n        targetSteer = constrain(s, -100, 100);\n        serialHold = true;\n        Serial.printf(\"drive t=%d s=%d\\n\", targetThrottle, targetSteer);\n      }\n      line = \"\";\n    } else if (line.length() < 32) {\n      line += c;\n    }\n  }\n}\n\nvoid setupWifi() {\n#ifdef SIMULATION\n  WiFi.mode(WIFI_STA);\n  WiFi.begin(\"Wokwi-GUEST\", \"\", 6);\n  Serial.print(\"Joining Wokwi-GUEST\");\n  while (WiFi.status() != WL_CONNECTED) { delay(200); Serial.print(\".\"); }\n  Serial.printf(\"\\nOpen http://%s\\n\", WiFi.localIP().toString().c_str());\n#else\n  uint16_t id = (uint16_t)(ESP.getEfuseMac() >> 32);  // last bytes of the chip's MAC\n  char ssid[20];\n  snprintf(ssid, sizeof(ssid), \"RC-Car-%04X\", id);\n  WiFi.mode(WIFI_AP);\n  WiFi.softAP(ssid, AP_PASSWORD);\n  WiFi.setSleep(false);  // lower latency\n  Serial.printf(\"Hotspot \\\"%s\\\" password \\\"%s\\\"\\nOpen http://%s\\n\",\n                ssid, AP_PASSWORD, WiFi.softAPIP().toString().c_str());\n#endif\n}\n\nvoid setup() {\n  Serial.begin(115200);\n\n  // Motor driver off and all outputs low before anything else\n  pinMode(PIN_STBY, OUTPUT); digitalWrite(PIN_STBY, LOW);\n  for (int p : {PIN_AIN1, PIN_AIN2, PIN_BIN1, PIN_BIN2, PIN_TRIG, PIN_LED}) {\n    pinMode(p, OUTPUT);\n    digitalWrite(p, LOW);\n  }\n  pinMode(PIN_ECHO, INPUT);\n  ledcAttach(PIN_PWMA, PWM_FREQ, PWM_BITS);  // ESP32 core 3.x API\n  ledcAttach(PIN_PWMB, PWM_FREQ, PWM_BITS);\n  ledcWrite(PIN_PWMA, 0);\n  ledcWrite(PIN_PWMB, 0);\n  digitalWrite(PIN_STBY, HIGH);\n\n  setupWifi();\n  server.on(\"/\", []() { server.send(200, \"text/html\", INDEX_HTML); });\n  server.on(\"/drive\", handleDrive);\n  server.on(\"/status\", sendStatus);\n  server.onNotFound([]() { server.send(404, \"text/plain\", \"not found\"); });\n  server.begin();\n  Serial.println(\"Ready. Serial test: type  d 50 0  then  d 0 0\");\n}\n\nvoid loop() {\n  server.handleClient();\n  handleSerial();\n\n  uint32_t now = millis();\n\n  // Failsafe: no fresh web command -> stop\n  if (!serialHold && now - lastCmdMs > FAILSAFE_MS) {\n    targetThrottle = 0;\n    targetSteer = 0;\n    webActive = false;\n  }\n\n  static uint32_t lastSensorMs = 0;\n  if (now - lastSensorMs >= 100) {\n    lastSensorMs = now;\n    if (USE_ULTRASONIC) distanceCm = readDistanceCm();\n    vbat = readBatteryVolts();\n  }\n\n  static uint32_t lastDriveMs = 0;\n  if (now - lastDriveMs >= 20) {\n    lastDriveMs = now;\n    applyDrive(targetThrottle, targetSteer);\n  }\n\n  // Status LED: solid while driving from the phone, slow blink while waiting\n  digitalWrite(PIN_LED, webActive ? HIGH : ((now / 500) % 2));\n}\n"};
globalThis.SHIM_SRC = {"Arduino.h":"// Minimal Arduino-ESP32 API for running sketches inside the digital twin.\n// Compiled to WebAssembly with no C library: every hardware call is\n// forwarded to JavaScript (src/twin-core.js), which models the circuit.\n#pragma once\n#include <stdint.h>\n#include <stddef.h>\n#include <stdarg.h>\n\nnamespace std {\ntemplate <class E> class initializer_list {\n  const E* b_;\n  size_t n_;\n  constexpr initializer_list(const E* b, size_t n) : b_(b), n_(n) {}\n public:\n  constexpr initializer_list() : b_(nullptr), n_(0) {}\n  constexpr size_t size() const { return n_; }\n  constexpr const E* begin() const { return b_; }\n  constexpr const E* end() const { return b_ + n_; }\n};\n}  // namespace std\n\n#define PROGMEM\n#define HIGH 1\n#define LOW 0\n#define INPUT 0x01\n#define OUTPUT 0x03\n#define INPUT_PULLUP 0x05\n#define INPUT_PULLDOWN 0x09\n\n#define HW_IMPORT(name) __attribute__((import_module(\"env\"), import_name(name)))\n\nextern \"C\" {\nHW_IMPORT(\"millis\") uint32_t hw_millis();\nHW_IMPORT(\"micros\") uint32_t hw_micros();\nHW_IMPORT(\"delay_us\") void hw_delay_us(uint32_t us);\nHW_IMPORT(\"pin_mode\") void hw_pin_mode(int pin, int mode);\nHW_IMPORT(\"digital_write\") void hw_digital_write(int pin, int val);\nHW_IMPORT(\"digital_read\") int hw_digital_read(int pin);\nHW_IMPORT(\"pulse_in\") uint32_t hw_pulse_in(int pin, int state, uint32_t timeout_us);\nHW_IMPORT(\"analog_mv\") uint32_t hw_analog_mv(int pin);\nHW_IMPORT(\"analog_raw\") int hw_analog_raw(int pin);\nHW_IMPORT(\"analog_write\") void hw_analog_write(int pin, int value);\nHW_IMPORT(\"ledc_attach\") int hw_ledc_attach(int pin, uint32_t freq, int bits);\nHW_IMPORT(\"ledc_write\") int hw_ledc_write(int pin, uint32_t duty);\nHW_IMPORT(\"serial_write\") void hw_serial_write(const char* p, int len);\nHW_IMPORT(\"serial_available\") int hw_serial_available();\nHW_IMPORT(\"serial_read\") int hw_serial_read();\n\nvoid* memcpy(void* d, const void* s, size_t n);\nvoid* memset(void* d, int c, size_t n);\nint memcmp(const void* a, const void* b, size_t n);\nsize_t strlen(const char* s);\nint strcmp(const char* a, const char* b);\nint vsnprintf(char* buf, size_t cap, const char* fmt, va_list ap);\nint snprintf(char* buf, size_t cap, const char* fmt, ...);\nint sscanf(const char* s, const char* fmt, ...);\n}\n\ninline uint32_t millis() { return hw_millis(); }\ninline uint32_t micros() { return hw_micros(); }\ninline void delay(uint32_t ms) { hw_delay_us(ms * 1000); }\ninline void delayMicroseconds(uint32_t us) { hw_delay_us(us); }\ninline void pinMode(int pin, int mode) { hw_pin_mode(pin, mode); }\ninline void digitalWrite(int pin, int val) { hw_digital_write(pin, val ? 1 : 0); }\ninline int digitalRead(int pin) { return hw_digital_read(pin); }\ninline unsigned long pulseIn(int pin, int state, unsigned long timeout = 1000000) {\n  return hw_pulse_in(pin, state, timeout);\n}\ninline uint32_t analogReadMilliVolts(int pin) { return hw_analog_mv(pin); }\ninline int analogRead(int pin) { return hw_analog_raw(pin); }      // 12-bit on ESP32, 10-bit on Uno\ninline void analogWrite(int pin, int value) { hw_analog_write(pin, value); }  // 8-bit PWM\n#ifdef BOARD_UNO\n#define A0 14\n#define A1 15\n#define A2 16\n#define A3 17\n#define A4 18\n#define A5 19\n#define LED_BUILTIN 13\n#else\n#define A0 36\n#define A3 39\n#define A4 32\n#define A5 33\n#define A6 34\n#define A7 35\n#define LED_BUILTIN 2\n#endif\ninline bool ledcAttach(int pin, uint32_t freq, int bits) { return hw_ledc_attach(pin, freq, bits); }\ninline bool ledcWrite(int pin, uint32_t duty) { return hw_ledc_write(pin, duty); }\n\ninline int abs(int x) { return x < 0 ? -x : x; }\ntemplate <class T, class U> inline T max(T a, U b) { return a > (T)b ? a : (T)b; }\ntemplate <class T, class U> inline T min(T a, U b) { return a < (T)b ? a : (T)b; }\ntemplate <class T, class L, class H> inline T constrain(T x, L lo, H hi) {\n  return x < (T)lo ? (T)lo : (x > (T)hi ? (T)hi : x);\n}\n\ninline long map(long x, long inMin, long inMax, long outMin, long outMax) {\n  return inMax == inMin ? outMin : (x - inMin) * (outMax - outMin) / (inMax - inMin) + outMin;\n}\ninline uint32_t& randomState() { static uint32_t s = 12345; return s; }\ninline void randomSeed(unsigned long seed) { randomState() = seed ? (uint32_t)seed : 1; }\ninline long random(long hi) {\n  uint32_t& s = randomState();\n  s ^= s << 13; s ^= s >> 17; s ^= s << 5;\n  return hi > 0 ? (long)(s % (uint32_t)hi) : 0;\n}\ninline long random(long lo, long hi) { return hi > lo ? lo + random(hi - lo) : lo; }\n#ifndef PI\n#define PI 3.1415926535897932384626433832795\n#endif\ntemplate <class T> inline T sq(T x) { return x * x; }\n#define DEC 10\n#define HEX 16\n#define BIN 2\n\n// Fixed-size String: enough for the short command lines and query args sketches use.\nclass String {\n  char buf_[128];\n  int len_;\n public:\n  String() : len_(0) { buf_[0] = 0; }\n  String(const char* s) : len_(0) { buf_[0] = 0; append(s); }\n  String(char c) : len_(0) { buf_[0] = 0; *this += c; }\n  String(int v, int base = DEC) : len_(0) { char t[40]; snprintf(t, sizeof(t), base == HEX ? \"%x\" : \"%d\", v); buf_[0] = 0; append(t); }\n  String(unsigned int v, int base = DEC) : len_(0) { char t[40]; snprintf(t, sizeof(t), base == HEX ? \"%x\" : \"%u\", v); buf_[0] = 0; append(t); }\n  String(long v, int base = DEC) : String((int)v, base) {}\n  String(unsigned long v, int base = DEC) : String((unsigned int)v, base) {}\n  String(double v, int digits = 2) : len_(0) {\n    static const char* const F[] = {\"%.0f\", \"%.1f\", \"%.2f\", \"%.3f\", \"%.4f\", \"%.5f\", \"%.6f\"};\n    char t[40]; snprintf(t, sizeof(t), F[digits < 0 ? 0 : digits > 6 ? 6 : digits], v); buf_[0] = 0; append(t);\n  }\n  String& operator=(const char* s) { len_ = 0; buf_[0] = 0; append(s); return *this; }\n  String& operator+=(char c) {\n    if (len_ < (int)sizeof(buf_) - 1) { buf_[len_++] = c; buf_[len_] = 0; }\n    return *this;\n  }\n  String& operator+=(const char* s) { append(s); return *this; }\n  String& operator+=(const String& s) { append(s.c_str()); return *this; }\n  template <class T> String& operator+=(T v) { return *this += String(v); }\n  template <class T> String operator+(const T& v) const { String r(*this); r += v; return r; }\n  void append(const char* s) { while (s && *s) *this += *s++; }\n  unsigned int length() const { return len_; }\n  const char* c_str() const { return buf_; }\n  long toInt() const {\n    const char* p = buf_;\n    while (*p == ' ') p++;\n    bool neg = false;\n    if (*p == '-' || *p == '+') neg = (*p++ == '-');\n    long v = 0;\n    while (*p >= '0' && *p <= '9') v = v * 10 + (*p++ - '0');\n    return neg ? -v : v;\n  }\n  bool operator==(const char* s) const { return strcmp(buf_, s) == 0; }\n  bool operator==(const String& s) const { return strcmp(buf_, s.buf_) == 0; }\n  bool operator!=(const char* s) const { return strcmp(buf_, s) != 0; }\n  float toFloat() const {\n    const char* p = buf_;\n    while (*p == ' ') p++;\n    bool neg = false;\n    if (*p == '-' || *p == '+') neg = (*p++ == '-');\n    float v = 0, scale = 1;\n    while (*p >= '0' && *p <= '9') v = v * 10 + (*p++ - '0');\n    if (*p == '.') { p++; while (*p >= '0' && *p <= '9') { scale /= 10; v += (*p++ - '0') * scale; } }\n    return neg ? -v : v;\n  }\n  char charAt(unsigned int i) const { return i < (unsigned)len_ ? buf_[i] : 0; }\n  char operator[](unsigned int i) const { return charAt(i); }\n  void trim() {\n    int a = 0;\n    while (a < len_ && (buf_[a] == ' ' || buf_[a] == '\\r' || buf_[a] == '\\n' || buf_[a] == '\\t')) a++;\n    int b = len_;\n    while (b > a && (buf_[b - 1] == ' ' || buf_[b - 1] == '\\r' || buf_[b - 1] == '\\n' || buf_[b - 1] == '\\t')) b--;\n    memcpy(buf_, buf_ + a, b - a); len_ = b - a; buf_[len_] = 0;\n  }\n  bool startsWith(const char* s) const { size_t n = strlen(s); return (size_t)len_ >= n && !memcmp(buf_, s, n); }\n  int indexOf(char c) const { for (int i = 0; i < len_; i++) if (buf_[i] == c) return i; return -1; }\n  String substring(unsigned int from, unsigned int to = 0xffff) const {\n    String r;\n    for (unsigned int i = from; i < to && i < (unsigned)len_; i++) r += buf_[i];\n    return r;\n  }\n};\ninline String operator+(const char* a, const String& b) { String r(a); r += b; return r; }\n\nclass HardwareSerial {\n public:\n  void begin(unsigned long) {}\n  int available() { return hw_serial_available(); }\n  int read() { return hw_serial_read(); }\n  void print(const char* s) { hw_serial_write(s, (int)strlen(s)); }\n  void print(const String& s) { print(s.c_str()); }\n  void print(char c) { hw_serial_write(&c, 1); }\n  void print(int v, int base = DEC) { print(String(v, base)); }\n  void print(unsigned int v, int base = DEC) { print(String(v, base)); }\n  void print(long v, int base = DEC) { print(String(v, base)); }\n  void print(unsigned long v, int base = DEC) { print(String(v, base)); }\n  void print(double v, int digits = 2) { print(String(v, digits)); }\n  void println() { print(\"\\n\"); }\n  template <class T> void println(const T& v) { print(v); print(\"\\n\"); }\n  template <class T> void println(const T& v, int f) { print(v, f); print(\"\\n\"); }\n  String readStringUntil(char end) {\n    String r;\n    uint32_t t0 = millis();\n    while (millis() - t0 < 1000) {\n      int c = read();\n      if (c < 0) { delay(1); continue; }\n      if (c == end) break;\n      r += (char)c;\n    }\n    return r;\n  }\n  operator bool() const { return true; }\n  int printf(const char* fmt, ...) __attribute__((format(printf, 2, 3)));\n};\nextern HardwareSerial Serial;\n\nclass EspClass {\n public:\n  // Fixed, so the simulated hotspot is always \"RC-Car-7E91\".\n  uint64_t getEfuseMac() { return 0x00007E91A2B3C4D5ULL; }\n};\nextern EspClass ESP;\n\n// Declared with C linkage so the sketch's setup()/loop() are exported by name.\nextern \"C\" {\nvoid setup();\nvoid loop();\n}\n","WiFi.h":"// Wi-Fi stand-in: the twin's virtual phone is always emmove(void* d, const void* s, size_t n) {\n  char* dp = (char*)d; const char* sp = (const char*)s;\n  if (dp < sp) { while (n--) *dp++ = *sp++; }\n  else { dp += n; sp += n; while (n--) *--dp = *--sp; }\n  return d;\n}\nvoid* memset(void* d, int c, size_t n) {\n  char* dp = (char*)d;\n  while (n--) *dp++ = (char)c;\n  return d;\n}\nsize_t strlen(const char* s) { size_t n = 0; while (s[n]) n++; return n; }\nint memcmp(const void* a, const void* b, size_t n) {\n  const unsigned char* x = (const unsigned char*)a; const unsigned char* y = (const unsigned char*)b;\n  for (; n; n--, x++, y++) if (*x != *y) return *x - *y;\n  return 0;\n}\nint strcmp(const char* a, const char* b) {\n  while (*a && *a == *b) { a++; b++; }\n  return (unsigned char)*a - (unsigned char)*b;\n}\n\nstruct Out {\n  char* buf; size_t cap; size_t n;\n  void put(char c) { if (n + 1 < cap) buf[n] = c; n++; }\n  void puts(const char* s, int width, bool left, char pad) {\n    int len = (int)strlen(s);\n    if (!left) for (int i = len; i < width; i++) put(pad);\n    while (*s) put(*s++);\n    if (left) for (int i = len; i < width; i++) put(' ');\n  }\n};\n\nstatic void fmtUnsigned(char* t, unsigned long long v, int base, bool upper) {\n  char tmp[24]; int i = 0;\n  const char* digits = upper ? \"0123456789ABCDEF\" : \"0123456789abcdef\";\n  do { tmp[i++] = digits[v % base]; v /= base; } while (v);\n  int j = 0;\n  while (i) t[j++] = tmp[--i];\n  t[j] = 0;\n}\n\nint vsnprintf(char* buf, size_t cap, const char* f, va_list ap) {\n  Out o{buf, cap, 0};\n  for (; *f; f++) {\n    if (*f != '%') { o.put(*f); continue; }\n    f++;\n    bool left = false; char pad = ' ';\n    while (*f == '-' || *f == '0') { if (*f == '-') left = true; else pad = '0'; f++; }\n    int width = 0;\n    while (*f >= '0' && *f <= '9') width = width * 10 + (*f++ - '0');\n    int prec = -1;\n    if (*f == '.') { f++; prec = 0; while (*f >= '0' && *f <= '9') prec = prec * 10 + (*f++ - '0'); }\n    int longs = 0;\n    while (*f == 'l') { longs++; f++; }\n    char t[48];\n    switch (*f) {\n      case 'd': case 'i': {\n        long long v = longs >= 2 ? va_arg(ap, long long) : longs ? va_arg(ap, long) : va_arg(ap, int);\n        char* p = t;\n        if (v < 0) { *p++ = '-'; v = -v; }\n        fmtUnsigned(p, (unsigned long long)v, 10, false);\n        o.puts(t, width, left, pad);\n        break;\n      }\n      case 'u': case 'x': case 'X': {\n        unsigned long long v = longs >= 2 ? va_arg(ap, unsigned long long)\n                             : longs ? va_arg(ap, unsigned long) : va_arg(ap, unsigned int);\n        fmtUnsigned(t, v, *f == 'u' ? 10 : 16, *f == 'X');\n        o.puts(t, width, left, pad);\n        break;\n      }\n      case 'f': {\n        double v = va_arg(ap, double);\n        if (prec < 0) prec = 6;\n        char* p = t;\n        if (v < 0) { *p++ = '-'; v = -v; }\n        double scale = 1;\n        for (int i = 0; i < prec; i++) scale *= 10;\n        unsigned long long whole = (unsigned long long)(v * scale + 0.5);\n        unsigned long long ip = whole / (unsigned long long)scale;\n        unsigned long long fp = whole % (unsigned long long)scale;\n        fmtUnsigned(p, ip, 10, false);\n        if (prec > 0) {\n          p += strlen(p);\n          *p++ = '.';\n          char fr[24]; fmtUnsigned(fr, fp, 10, false);\n          for (int i = (int)strlen(fr); i < prec; i++) *p++ = '0';\n          memcpy(p, fr, strlen(fr) + 1);\n        }\n        o.puts(t, width, left, pad);\n        break;\n      }\n      case 's': o.puts(va_arg(ap, const char*), width, left, ' '); break;\n      case 'c': o.put((char)va_arg(ap, int)); break;\n      case '%': o.put('%'); break;\n      default: o.put('%'); o.put(*f); break;\n    }\n  }\n  if (cap) buf[o.n < cap ? o.n : cap - 1] = 0;\n  return (int)o.n;\n}\n\nint snprintf(char* buf, size_t cap, const char* fmt, ...) {\n  va_list ap; va_start(ap, fmt);\n  int n = vsnprintf(buf, cap, fmt, ap);\n  va_end(ap);\n  return n;\n}\n\n// Supports literal characters, whitespace and %d, which is what sketches here use.\nint sscanf(const char* s, const char* f, ...) {\n  va_list ap; va_start(ap, f);\n  int got = 0;\n  for (; *f; f++) {\n    if (*f == ' ') { while (*s == ' ' || *s == '\\t') s++; continue; }\n    if (*f == '%' && f[1] == 'd') {\n      f++;\n      while (*s == ' ') s++;\n      bool neg = false;\n      if (*s == '-' || *s == '+') neg = (*s++ == '-');\n      if (*s < '0' || *s > '9') break;\n      int v = 0;\n      while (*s >= '0' && *s <= '9') v = v * 10 + (*s++ - '0');\n      *va_arg(ap, int*) = neg ? -v : v;\n      got++;\n      continue;\n    }\n    if (*s != *f) break;\n    s++;\n  }\n  va_end(ap);\n  return got;\n}\n}  // extern \"C\"\n\nint HardwareSerial::printf(const char* fmt, ...) {\n  char t[256];\n  va_list ap; va_start(ap, fmt);\n  int n = vsnprintf(t, sizeof(t), fmt, ap);\n  va_end(ap);\n  hw_serial_write(t, n < (int)sizeof(t) ? n : (int)sizeof(t) - 1);\n  return n;\n}\n\nvoid WebServer::handleClient() {\n  if (!hw_http_poll(path_, sizeof(path_), query_, sizeof(query_))) return;\n  for (int i = 0; i < count_; i++) {\n    if (strcmp(paths_[i], path_) == 0) { handlers_[i](); return; }\n  }\n  if (notFound_) notFound_();\n}\n\nString WebServer::arg(const char* name) const {\n  String out;\n  size_t nlen = strlen(name);\n  const char* p = query_;\n  while (*p) {\n    const char* key = p;\n    while (*p && *p != '=' && *p != '&') p++;\n    bool match = (size_t)(p - key) == nlen && !memcmp(key, name, nlen);\n    if (*p == '=') p++;\n    while (*p && *p != '&') { if (match) out += *p; p++; }\n    if (match) return out;\n    if (*p == '&') p++;\n  }\n  return out;\n}\n"};

    },
    check(c) {
      const i = c.s.iAvg || 0;
      if (i > meta.maxA * 2) c.issue('fail', `Short circuit: ${fmtA(i)} from the battery`, 'Something connects + to − with almost no resistance. Find the wire or part that bypasses the load.');
      else if (i > meta.maxA) c.issue('fail', `Overloaded: ${fmtA(i)} (this battery gives about ${meta.maxA} A)`, 'Use a bigger battery or reduce the load.');
      if (i < -0.05) c.issue('warn', `Current is flowing back into the battery (${fmtA(-i)})`, 'Another supply is pushing into it. Separate the supplies or add a diode.');
      const v = c.vd('+', '-');
      if (v < meta.cells * meta.cutoff && c.p.charge > 1) c.issue('warn', `Battery sags to ${fmtV(v)} under load (empty below ${(meta.cells * meta.cutoff).toFixed(1)} V)`, 'Charge or replace it.');
    },
    readings(c) {
      return [['Voltage', fmtV(c.vd('+', '-'))], ['Current', fmtA(c.s.iAvg || 0)], ['Charge', `${c.p.charge.toFixed(1)} %`], ['Capacity', `${meta.capacityAh} Ah`]];
    },
    visual: (c) => ({ charge: c.p.charge, amps: c.s.iAvg || 0 }),
  };
}

function interp(t, x) {
  if (x <= t[0][0]) return t[0][1];
  for (let i = 1; i < t.length; i++) if (x <= t[i][0]) return t[i - 1][1] + ((t[i][1] - t[i - 1][1]) * (x - t[i - 1][0])) / (t[i][0] - t[i - 1][0]);
  return t[t.length - 1][1];
}
