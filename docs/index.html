function placeView(p, v) {
  const d = v.div;
  d.style.left = `${p.x}px`;
  d.style.top = `${p.y}px`;
  d.style.width = `${v.w}px`;
  d.style.height = `${v.h}px`;
  d.style.transform = p.rot ? `rotate(${p.rot}deg)` : '';
  // Name tag above the rotated outline.
  const turned = (p.rot || 0) % 180 !== 0;
  v.tag.textContent = p.id;
  v.tag.style.left = `${p.x + (turned ? (v.w - v.h) / 2 : 0)}px`;
  v.tag.style.top = `${p.y + (turned ? (v.h - v.w) / 2 : 0) - 14}px`;
  d.classList.toggle('sel', sel?.kind === 'part' && sel.id === p.id);
  const def = LIB[p.type];
  d.classList.toggle('live', running && !!def.interactive && !!def.el);
}

// Wokwi elements raise their own events for buttons, knobs and switches.
function hookElement(id, el, def) {
  const simPart = () => sim?.partById(id);
  if (def.interactive === 'button') {
    el.addEventListener('button-press', () => { const sp = simPart(); if (sp) sp.state.pressed = true; });
    el.addEventListener('button-release', () => { const sp = simPart(); if (sp) sp.state.pressed = false; });
  }
  if (def.interactive === 'knob' || def.interactive === 'slide') {
    el.addEventListener('input', (e) => {
      const p = partOf(id);
      if (!p) return;
      const val = def.interactive === 'knob' ? Math.round(Number(e.detail ?? el.value)) : Number(el.value);
      p.props = { ...p.props, value: val };
      const sp = simPart();
      if (sp) sp.props.value = val;
      save();
      if (sel?.kind === 'part' && sel.id === id) syncForm();
    });
  }
}

async function rebuildAll() {
  for (const v of views.values()) { v.div.remove(); v.tag.remove(); }
  views.clear();
  for (const p of doc.parts) makeView(p);
  await Promise.all([...views.values()].map((v) => v.ready));
  renderWires();
}

// Pin position in world coordinates, following the part's rotation.
function pinXY(id, pin) {
  const p = partOf(id);
  const v = views.get(id);
  const l = v?.pins[pin];
  if (!p || !l) return null;
  const cx = v.w / 2;
  const cy = v.h / 2;
  const a = ((p.rot || 0) * Math.PI) / 180;
  const dx = l[0] - cx;
  const dy = l[1] - cy;
  return [p.x + cx + dx * Math.cos(a) - dy * Math.sin(a), p.y + cy + dx * Math.sin(a) + dy * Math.cos(a)];
}

// ---------- wires ----------
const pathOf = (pts) => `M${pts.map((q) => `${q[0].toFixed(1)} ${q[1].toFixed(1)}`).join('L')}`;
const flowMode = () => $('flowSel').value;

// Points of a wire on screen, following a dragged end if there is one.
function wirePoints(w, i) {
  let a = pinXY(w.a.part, w.a.pin);
  let b = pinXY(w.b.part, w.b.pin);
  if (wdrag?.i === i && wdrag.kind === 'end' && wdrag.cursor) {
    if (wdrag.end === 'a') a = wdrag.cursor; else b = wdrag.cursor;
  }
  if (!a || !b) return null;
  return [a, ...(w.pts || []), b];
}

function renderWires() {
  let h = '';
  const showFlow = sim && flowMode() !== 'off';
  doc.wires.forEach((w, i) => {
    const pts = wirePoints(w, i);
    if (!pts) return;
    const d = pathOf(pts);
    const on = sel?.kind === 'wire' && sel.i === i;
    const hl = hoverNet?.has(i) ? ' hl' : '';
    if (on) h += `<path class="wsel" d="${d}"/>`;
    h += `<path class="wo${hl}" d="${d}"/><path class="w${on ? ' sel' : ''}${hl}" data-wire="${i}" style="stroke:${wireColor(w.color)}" d="${d}"/>`;
    if (showFlow) h += `<path class="flow${flowMode() === 'electrons' ? ' e' : ''}" data-fi="${i}" d="${d}" style="display:none"/>`;
  });
  const near = wdrag?.near;
  const targets = guideTargets();
  for (const p of doc.parts) {
    const v = views.get(p.id);
    if (!v) continue;
    for (const pin of Object.keys(v.pins)) {
      const xy = pinXY(p.id, pin);
      if (!xy) continue;
      let cls = 'pin';
      if (near && near.part === p.id && near.pin === pin) cls += ' near';
      else if (targets.has(`${p.id}:${pin}`)) cls += ' target';
      h += `<circle class="${cls}" data-part="${esc(p.id)}" data-pin="${esc(pin)}" cx="${xy[0].toFixed(1)}" cy="${xy[1].toFixed(1)}" r="4"/>`;
    }
  }
  // Handles of the selected wire: round ends move it to another pin,
  // squares are bends, the faint dots in the middle of segments add a bend.
  if (sel?.kind === 'wire' && doc.wires[sel.i] && !draft) {
    const i = sel.i;
    const pts = wirePoints(doc.wires[i], i);
    if (pts) {
      const r = 6 / Math.max(view.z, 0.6);
      for (let k = 0; k < pts.length - 1; k++) {
        const m = [(pts[k][0] + pts[k + 1][0]) / 2, (pts[k][1] + pts[k + 1][1]) / 2];
        if (Math.hypot(pts[k][0] - pts[k + 1][0], pts[k][1] - pts[k + 1][1]) > 24) h += `<circle class="h mid" data-h="mid" data-seg="${k}" cx="${m[0]}" cy="${m[1]}" r="${r * 0.7}"><title>Drag to add a bend</title></circle>`;
      }
      (doc.wires[i].pts || []).forEach((q, k) => { h += `<rect class="h bend" data-h="bend" data-k="${k}" x="${q[0] - r * 0.8}" y="${q[1] - r * 0.8}" width="${r * 1.6}" height="${r * 1.6}"><title>Drag to move the bend; double-click to remove it</title></rect>`; });
      if (!(wdrag?.kind === 'end' && wdrag.end === 'a')) h += `<circle class="h end" data-h="end" data-end="a" cx="${pts[0][0]}" cy="${pts[0][1]}" r="${r}"><title>Drag onto another pin to move this end</title></circle>`;
      if (!(wdrag?.kind === 'end' && wdrag.end === 'b')) h += `<circle class="h end" data-h="end" data-end="b" cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="${r}"><title>Drag onto another pin to move this end</title></circle>`;
    }
  }
  if (draft) {
    const a = pinXY(draft.a.part, draft.a.pin);
    if (a) h += `<path class="draft" d="${pathOf([a, ...draft.pts, draft.cursor || a])}"/>`;
  }
  wiresSvg.innerHTML = h;
  paintFlow(0);
  updateSelbar();
}

// Moving dots on each wire: speed grows with the current (log scale),
// direction is conventional current (+ to −) or electrons (− to +).
function paintFlow(dtSec) {
  if (!flowNow) return;
  const els = wiresSvg.querySelectorAll('.flow');
  const dirE = flowMode() === 'electrons' ? -1 : 1;
  for (const el of els) {
    const i = Number(el.dataset.fi);
    const I = flowNow[i] || 0;
    const mag = Math.abs(I);
    if (!(mag > 2e-5)) { el.style.display = 'none'; continue; }
    el.style.display = '';
    const speed = Math.min(140, 12 + 24 * Math.log10(mag / 1e-5));
    flowOffset[i] = ((flowOffset[i] || 0) - Math.sign(I) * dirE * speed * dtSec) % 1400;
    el.style.strokeDashoffset = flowOffset[i];
  }
}

// Wires that share a net with a pin (through other wires or links inside parts).
function netWires(start) {
  const adj = new Map();
  const link = (u, v, wi) => { if (!adj.has(u)) adj.set(u, []); adj.get(u).push([v, wi]); };
  doc.wires.forEach((w, i) => { const u = `${w.a.part}:${w.a.pin}`; const v = `${w.b.part}:${w.b.pin}`; link(u, v, i); link(v, u, i); });
  for (const p of doc.parts) {
    const def = LIB[p.type];
    for (const g of def.internal ? def.internal(propsOf(p)) : []) for (let k = 1; k < g.length; k++) { link(`${p.id}:${g[0]}`, `${p.id}:${g[k]}`, -1); link(`${p.id}:${g[k]}`, `${p.id}:${g[0]}`, -1); }
  }
  const seen = new Set([start]);
  const ws = new Set();
  const pins = new Set([start]);
  const stack = [start];
  while (stack.length) {
    const u = stack.pop();
    for (const [v, wi] of adj.get(u) || []) {
      if (wi >= 0) ws.add(wi);
      if (!seen.has(v)) { seen.add(v); pins.add(v); stack.push(v); }
    }
  }
  return { wires: ws, pins };
}

function nearestPin(xy, exclude) {
  let best = null;
  let bd = 14 / Math.max(view.z, 0.5);
  for (const p of doc.parts) {
    const v = views.get(p.id);
    for (const pin of Object.keys(v?.pins || {})) {
      if (exclude && exclude.part === p.id && exclude.pin === pin) continue;
      const q = pinXY(p.id, pin);
      const d = q && Math.hypot(q[0] - xy[0], q[1] - xy[1]);
      if (q && d < bd) { bd = d; best = { part: p.id, pin }; }
    }
  }
  return best;
}

function autoColor(a, b) {
  const pins = [a.pin, b.pin].map((x) => x.toUpperCase());
  if (pins.some((x) => /^(GND|-|IN-|OUT-|COM\.?\d?|S)$|^GND/.test(x))) return 'black';
  if (pins.some((x) => /^(VIN|VCC|5V|3V3|3\.3V|\+|V\+|VM|IN\+|OUT\+|\+12V|\+5V|VOUT)$/.test(x))) return 'red';
  const cycle = ['green', 'blue', 'orange', 'purple', 'yellow'];
  return cycle[doc.wires.length % cycle.length];
}

function onPin(part, pin) {
  if (graph.picking) { graph.picking = false; stage.classList.remove('picking'); addProbe({ kind: 'pin', part, pin }); toast(`Probing ${part}.${pin}`); return; }
  if (!draft) {
    draft = { a: { part, pin }, pts: [], cursor: pinXY(part, pin) };
    stage.classList.add('wiring');
    setHint();
    renderWires();
    return;
  }
  if (draft.a.part === part && draft.a.pin === pin) { cancelDraft(); return; }
  pushHistory();
  const w = { a: draft.a, b: { part, pin }, color: autoColor(draft.a, { part, pin }), pts: draft.pts };
  doc.wires.push(w);
  draft = null;
  stage.classList.remove('wiring');
  sel = { kind: 'wire', i: doc.wires.length - 1 };
  setHint();
  changed(true);
}

function cancelDraft() {
  draft = null;
  stage.classList.remove('wiring');
  setHint();
  renderWires();
}

// ---------- view transform ----------
function applyView() {
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.z})`;
  const g = 10 * view.z;
  stage.style.backgroundImage = `radial-gradient(circle, var(--grid) ${Math.max(0.8, view.z)}px, transparent ${Math.max(0.8, view.z)}px)`;
  stage.style.backgroundSize = `${g}px ${g}px`;
  stage.style.backgroundPosition = `${view.x}px ${view.y}px`;
}
function toWorld(e) {
  const r = stage.getBoundingClientRect();
  return [(e.clientX - r.left - view.x) / view.z, (e.clientY - r.top - view.y) / view.z];
}
function zoomAt(f, cx, cy) {
  const z = Math.min(4, Math.max(0.2, view.z * f));
  view.x = cx - ((cx - view.x) * z) / view.z;
  view.y = cy - ((cy - view.y) * z) / view.z;
  view.z = z;
  applyView();
}
function fit() {
  if (!doc.parts.length) { const r = stage.getBoundingClientRect(); view = { x: r.width / 2, y: r.height / 2, z: 1.5 }; applyView(); return; }
  let x0 = Infinity; let y0 = Infinity; let x1 = -Infinity; let y1 = -Infinity;
  const grow = (x, y) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
  for (const p of doc.parts) {
    const v = views.get(p.id);
    const r = Math.max(v?.w || 40, v?.h || 40) / 2;
    const cx = p.x + (v?.w || 40) / 2;
    const cy = p.y + (v?.h || 40) / 2;
    const rw = p.rot % 180 ? (v?.h || 40) / 2 : (v?.w || 40) / 2;
    const rh = p.rot % 180 ? (v?.w || 40) / 2 : (v?.h || 40) / 2;
    grow(cx - rw, cy - rh - 16); grow(cx + rw, cy + rh);
    void r;
  }
  for (const w of doc.wires) for (const q of w.pts || []) grow(q[0], q[1]);
  const r = stage.getBoundingClientRect();
  const z = Math.min(2, Math.max(0.25, Math.min((r.width - 40) / (x1 - x0), (r.height - 70) / (y1 - y0))));
  view = { z, x: (r.width - (x1 - x0) * z) / 2 - x0 * z, y: (r.height - 30 - (y1 - y0) * z) / 2 - y0 * z };
  applyView();
}

// ---------- pointer handling ----------
const pointers = new Map();
let drag = null;
let pan = null;
let pinch = null;

stage.addEventListener('pointerdown', (e) => {
  if (e.target.closest?.('.zoom')) return;
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  closeMenus();
  if (pointers.size === 2) {
    drag = null; pan = null;
    const [p1, p2] = [...pointers.values()];
    pinch = { d: Math.hypot(p1[0] - p2[0], p1[1] - p2[1]), z: view.z };
    return;
  }
  const t = e.target;
  const w = toWorld(e);
  if (t.dataset?.h && sel?.kind === 'wire') {
    e.preventDefault();
    wdrag = { i: sel.i, kind: t.dataset.h, end: t.dataset.end, k: Number(t.dataset.k), seg: Number(t.dataset.seg), start: w, moved: false };
    stage.setPointerCapture(e.pointerId);
    return;
  }
  if (t.classList?.contains('pin')) { e.preventDefault(); onPin(t.dataset.part, t.dataset.pin); return; }
  if (draft) { draft.pts.push([snap(w[0]), snap(w[1])]); renderWires(); return; }
  const wireEl = t.closest?.('.w');
  if (wireEl) { select({ kind: 'wire', i: Number(wireEl.dataset.wire) }); return; }
  const partEl = t.closest?.('.part');
  if (partEl) {
    const id = partEl.dataset.id;
    const p = partOf(id);
    const def = LIB[p.type];
    select({ kind: 'part', id });
    if (running && partEl.classList.contains('live')) return;
    if (running && def.interactive === 'toggle') { setProp(id, 'on', !propsOf(p).on); return; }
    drag = { id, start: w, ox: p.x, oy: p.y, moved: false };
    stage.setPointerCapture(e.pointerId);
    return;
  }
  select(null);
  pan = { sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y };
  stage.setPointerCapture(e.pointerId);
});

let moveQueued = false;
stage.addEventListener('pointermove', (e) => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && pointers.size === 2) {
    const [p1, p2] = [...pointers.values()];
    const d = Math.hypot(p1[0] - p2[0], p1[1] - p2[1]);
    const r = stage.getBoundingClientRect();
    zoomAt((pinch.z * d) / pinch.d / view.z, (p1[0] + p2[0]) / 2 - r.left, (p1[1] + p2[1]) / 2 - r.top);
    return;
  }
  if (wdrag) {
    const w = toWorld(e);
    const wire = doc.wires[wdrag.i];
    if (!wdrag.moved) {
      if (Math.hypot(w[0] - wdrag.start[0], w[1] - wdrag.start[1]) < 3 / view.z) return;
      wdrag.moved = true;
      pushHistory();
      if (wdrag.kind === 'mid') { wire.pts = wire.pts || []; wire.pts.splice(wdrag.seg, 0, [snap(w[0]), snap(w[1])]); wdrag.kind = 'bend'; wdrag.k = wdrag.seg; }
    }
    if (wdrag.kind === 'bend') wire.pts[wdrag.k] = [snap(w[0]), snap(w[1])];
    if (wdrag.kind === 'end') {
      wdrag.cursor = w;
      wdrag.near = nearestPin(w, wdrag.end === 'a' ? wire.b : wire.a);
    }
    queueWires();
    return;
  }
  if (drag) {
    const w = toWorld(e);
    const p = partOf(drag.id);
    const nx = snap(drag.ox + w[0] - drag.start[0]);
    const ny = snap(drag.oy + w[1] - drag.start[1]);
    if (!drag.moved && (nx !== p.x || ny !== p.y)) { drag.moved = true; pushHistory(); }
    p.x = nx; p.y = ny;
    placeView(p, views.get(p.id));
    queueWires();
    return;
  }
  if (pan) {
    view.x = pan.vx + e.clientX - pan.sx;
    view.y = pan.vy + e.clientY - pan.sy;
    applyView();
    return;
  }
  if (draft) { draft.cursor = toWorld(e); queueWires(); }
  showTip(e);
});
function queueWires() {
  if (moveQueued) return;
  moveQueued = true;
  requestAnimationFrame(() => { moveQueued = false; renderWires(); });
}
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (wdrag) {
    const wd = wdrag;
    wdrag = null;
    if (wd.moved && wd.kind === 'end') {
      const wire = doc.wires[wd.i];
      if (wd.near) {
        const old = wire[wd.end];
        wire[wd.end] = { ...wd.near };
        // The bend next to the moved end would now point the wrong way.
        if (wire.pts?.length) wire.pts = [];
        toast(`Moved from ${old.part}.${old.pin} to ${wd.near.part}.${wd.near.pin}`);
        changed(true);
      } else {
        history.pop();
        updateHistBtns();
        toast('Drop the wire end on a pin to move it');
      }
    } else if (wd.moved) save();
    renderWires();
    return;
  }
  if (drag?.moved) save();
  drag = null;
  pan = null;
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);
stage.addEventListener('pointerleave', () => { $('tip').hidden = true; setHover(null); });
stage.addEventListener('dblclick', (e) => {
  const t = e.target;
  if (t.dataset?.h === 'bend' && sel?.kind === 'wire') {
    pushHistory();
    doc.wires[sel.i].pts.splice(Number(t.dataset.k), 1);
    save();
    renderWires();
  } else if (t.closest?.('.w') && !draft) {
    // Double-click on a wire adds a bend there.
    const i = Number(t.closest('.w').dataset.wire);
    const w = toWorld(e);
    const pts = wirePoints(doc.wires[i], i);
    let bestK = 0; let bd = Infinity;
    for (let k = 0; k < pts.length - 1; k++) {
      const [x0, y0] = pts[k]; const [x1, y1] = pts[k + 1];
      const L = Math.hypot(x1 - x0, y1 - y0) || 1;
      const u = Math.max(0, Math.min(1, ((w[0] - x0) * (x1 - x0) + (w[1] - y0) * (y1 - y0)) / (L * L)));
      const d = Math.hypot(x0 + u * (x1 - x0) - w[0], y0 + u * (y1 - y0) - w[1]);
      if (d < bd) { bd = d; bestK = k; }
    }
    pushHistory();
    doc.wires[i].pts = doc.wires[i].pts || [];
    doc.wires[i].pts.splice(bestK, 0, [snap(w[0]), snap(w[1])]);
    sel = { kind: 'wire', i };
    save();
    renderWires();
  }
});
function setHover(pinKey) {
  const next = pinKey ? netWires(pinKey).wires : null;
  const same = next && hoverNet && next.size === hoverNet.size && [...next].every((x) => hoverNet.has(x));
  if (same || (!next && !hoverNet)) return;
  hoverNet = next;
  for (const el of wiresSvg.querySelectorAll('.w, .wo')) el.classList.remove('hl');
  if (!hoverNet) return;
  for (const el of wiresSvg.querySelectorAll('.w')) {
    if (hoverNet.has(Number(el.dataset.wire))) { el.classList.add('hl'); el.previousElementSibling?.classList.add('hl'); }
  }
}
stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
$('zIn').onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(1.25, r.width / 2, r.height / 2); };
$('zOut').onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(0.8, r.width / 2, r.height / 2); };
$('zFit').onclick = fit;

function showTip(e) {
  const tip = $('tip');
  const t = e.target;
  const wireEl = t.closest?.('.w');
  if (!t.classList?.contains('pin') && !wireEl) { tip.hidden = true; setHover(null); return; }
  let text;
  if (wireEl) {
    const i = Number(wireEl.dataset.wire);
    const w = doc.wires[i];
    setHover(`${w.a.part}:${w.a.pin}`);
    text = `Wire ${w.a.part}.${w.a.pin} → ${w.b.part}.${w.b.pin}`;
    if (sim && flowNow) {
      const I = flowNow[i] || 0;
      const mag = Math.abs(I);
      text += mag < 2e-5 ? ' · no current' : ` · ${mag < 0.1 ? `${(mag * 1000).toFixed(1)} mA` : `${mag.toFixed(2)} A`} (${I > 0 ? `${w.a.part} → ${w.b.part}` : `${w.b.part} → ${w.a.part}`})`;
    }
    text += ' · click to select, double-click to add a bend';
  } else {
    const { part, pin } = t.dataset;
    setHover(`${part}:${pin}`);
    const p = partOf(part);
    const desc = p ? pinInfo(p.type, pin) : '';
    text = `${part}.${pin}${desc ? ` — ${desc}` : ''}`;
    if (sim) {
      const n = sim.node(part, pin);
      if (n >= 0) text += sim.floating[n] ? ' · not driven' : ` · ${sim.V[n].toFixed(2)} V`;
    }
    const others = [...netWires(`${part}:${pin}`).pins].filter((k) => k !== `${part}:${pin}`).map((k) => k.replace(':', '.'));
    text += others.length ? ` · connected to ${others.slice(0, 4).join(', ')}${others.length > 4 ? '…' : ''}` : ' · click to start a wire';
  }
  tip.textContent = text;
  tip.hidden = false;
  tip.style.left = `${Math.min(e.clientX + 12, innerWidth - 330)}px`;
  tip.style.top = `${e.clientY + 14}px`;
}

document.addEventListener('keydown', (e) => {
  if (e.target.closest?.('input, select, textarea')) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && ((k === 'z' && e.shiftKey) || k === 'y')) { e.preventDefault(); redo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); undo(); return; }
  if (e.key === ' ' && !e.target.closest?.('button')) { e.preventDefault(); if (running) pauseRun(); else startRun(); return; }
  if (e.key === 'Escape') { if (graph.picking) { graph.picking = false; stage.classList.remove('picking'); renderSide(); return; } if (draft) cancelDraft(); else select(null); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'v' && clip) { e.preventDefault(); pastePart(clip); return; }
  if (!sel) return;
  if ((e.ctrlKey || e.metaKey) && k === 'c' && sel.kind === 'part') { clip = clone(partOf(sel.id)); toast(`Copied ${sel.id}. Ctrl+V pastes it.`); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'd' && sel.kind === 'part') { e.preventDefault(); pastePart(partOf(sel.id)); return; }
  if (e.ctrlKey || e.metaKey) return;
  if (e.key === 'r' || e.key === 'R') { if (sel.kind === 'part') rotate(sel.id); }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removeSelected(); }
});

// ---------- editing ----------
function select(s) {
  sel = s;
  for (const p of doc.parts) views.get(p.id)?.div.classList.toggle('sel', s?.kind === 'part' && s.id === p.id);
  renderWires();
  sideView = null;
  if (s && !['inspect', 'checks', 'phone', 'graph'].includes(tab) && !(tab === 'guide' && doc.guided)) tab = 'inspect';
  renderSide();
}

function rotate(id) {
  const p = partOf(id);
  pushHistory();
  p.rot = ((p.rot || 0) + 90) % 360;
  placeView(p, views.get(id));
  renderWires();
  save();
}

function removeSelected() {
  if (!sel) return;
  pushHistory();
  if (sel.kind === 'part') {
    const id = sel.id;
    doc.parts = doc.parts.filter((p) => p.id !== id);
    doc.wires = doc.wires.filter((w) => w.a.part !== id && w.b.part !== id);
    views.get(id)?.div.remove();
    views.get(id)?.tag.remove();
    views.delete(id);
  } else {
    doc.wires.splice(sel.i, 1);
  }
  sel = null;
  changed(true);
}

let clip = null;
// Paste a copy of a part (same type, settings and rotation) next to the original.
async function pastePart(src) {
  if (!src || !LIB[src.type]) return;
  const pre = prefixOf(src.type);
  let n = 1;
  while (partOf(`${pre}${n}`)) n++;
  pushHistory();
  let x = src.x + 30;
  let y = src.y + 30;
  while (doc.parts.some((q) => q.x === x && q.y === y)) { x += 30; y += 30; }
  const p = { ...clone(src), id: `${pre}${n}`, x: snap(x), y: snap(y) };
  doc.parts.push(p);
  const v = makeView(p);
  await v.ready;
  placeView(p, v);
  changed(true);
  select({ kind: 'part', id: p.id });
  toast(`Added ${p.id}, a copy of ${src.id}`);
}

async function addPart(type) {
  const def = LIB[type];
  const pre = prefixOf(type);
  let n = 1;
  while (partOf(`${pre}${n}`)) n++;
  const r = stage.getBoundingClientRect();
  const c = [(r.width / 2 - view.x) / view.z, (r.height / 2 - view.y) / view.z];
  pushHistory();
  // In a guided build the part takes the example's name and place.
  const ex = doc.guided ? exampleOf() : null;
  const exPart = ex?.parts.find((q) => q.type === type && !partOf(q.id));
  const p = { id: exPart ? exPart.id : `${pre}${n}`, type, x: snap(c[0]), y: snap(c[1]), rot: exPart?.rot || 0, props: {} };
  if (def.mcu && def.props.firmware) p.props.firmware = 'blink';
  doc.parts.push(p);
  const v = makeView(p);
  await v.ready;
  if (exPart) {
    [p.x, p.y] = [exPart.x, exPart.y];
    placeView(p, v);
    sel = { kind: 'part', id: p.id };
    changed(true);
    select(sel);
    fit();
    return;
  }
  // Find a free spot near the middle of the view, so new parts never stack.
  const boxes = doc.parts.filter((q) => q !== p).map((q) => { const qv = views.get(q.id); return [q.x, q.y, q.x + (qv?.w || 40), q.y + (qv?.h || 40)]; });
  const free = (x, y) => boxes.every(([x0, y0, x1, y1]) => x + v.w + 15 < x0 || x > x1 + 15 || y + v.h + 25 < y0 || y > y1 + 25);
  let spot = [snap(c[0] - v.w / 2), snap(c[1] - v.h / 2)];
  for (let ring = 1; ring < 30 && !free(...spot); ring++) {
    const a = ring * 2.4;
    spot = [snap(c[0] - v.w / 2 + Math.cos(a) * ring * 30), snap(c[1] - v.h / 2 + Math.sin(a) * ring * 25)];
  }
  [p.x, p.y] = spot;
  placeView(p, v);
  // Pan so the new part is in view.
  const sx = p.x * view.z + view.x;
  const sy = p.y * view.z + view.y;
  if (sx < 0 || sy < 0 || sx + v.w * view.z > r.width || sy + v.h * view.z > r.height) {
    view.x = r.width / 2 - (p.x + v.w / 2) * view.z;
    view.y = r.height / 2 - (p.y + v.h / 2) * view.z;
    applyView();
  }
  sel = { kind: 'part', id: p.id };
  if (narrow.matches) tab = 'inspect';
  changed(true);
  select(sel);
}

function setProp(id, k, val, live = false) {
  const p = partOf(id);
  const def = LIB[p.type];
  if (!live) pushHistory();
  p.props = { ...p.props, [k]: val };
  const sp = sim?.partById(id);
  if (sp) sp.props[k] = val;
  const v = views.get(id);
  if (def.el) {
    for (const [ak, av] of Object.entries(def.attrs?.(propsOf(p)) || {})) v.inner.setAttribute(ak, av);
    if (k === 'value' && v.inner && 'value' in v.inner) v.inner.value = val;
  } else {
    v.custom = drawingFor(def, propsOf(p));
    paintCustom(p, v, null);
  }
  save();
  if (k === 'firmware' && sim) restartSim('Firmware changed: simulation restarted');
  if (!live) { lastCheck = null; sim?.issues.clear(); if (tab === 'bom' || tab === 'checks') renderSide(); }
}

// Called after any change to parts or wires.
function changed(structural) {
  save();
  renderWires();
  lastCheck = null;
  if (structural && sim) restartSim(running ? 'Circuit changed: simulation restarted' : null);
  renderSide();
  setHint();
  refreshGuide();
}

// ---------- simulation ----------
function newSim() {
  serialBuf.clear();
  graphReset();
  const s = new Bench(clone(doc), LIB, {
    firmware: FW,
    onSerial: (id, text) => {
      graphSerial(id, text);
      serialBuf.set(id, ((serialBuf.get(id) || '') + text).slice(-20000));
      if (tab === 'serial') paintSerial();
    },
  });
  s.recordFlow = true;
  return s;
}

function restartSim(msg) {
  try { sim = newSim(); } catch (err) { sim = null; running = false; toast(err.message); updateRunBtn(); return; }
  displayUs = 0;
  flowNow = null;
  if (msg) toast(msg);
  for (const v of views.values()) v.visKey = '';
  renderWires();
}

function startRun() {
  if (!doc.parts.length) { toast('Add some parts first'); return; }
  if (!sim) restartSim();
  if (!sim) return;
  running = true;
  displayUs = sim.timeUs;
  lastFrame = performance.now();
  for (const p of doc.parts) placeView(p, views.get(p.id));
  updateRunBtn();
  renderWires();
  requestAnimationFrame(frame);
}
function pauseRun() {
  running = false;
  if (doc) for (const p of doc.parts) placeView(p, views.get(p.id));
  updateRunBtn();
}
// Stop: power off and reset everything to the start.
function stopSim() {
  running = false;
  sim = null;
  flowNow = null;
  lagging = false;
  if (doc) { for (const p of doc.parts) placeView(p, views.get(p.id)); resetVisuals(); }
  updateRunBtn();
  renderWires();
  liveUi();
  renderSide();
}
function updateRunBtn() {
  $('runBtn').textContent = running ? '⏸ Pause' : sim ? '▶ Resume' : '▶ Run';
  $('stopBtn').disabled = !sim;
  updateClock();
  setHint();
  updateSelbar();
  $('legend').hidden = !sim || flowMode() === 'off';
  $('legend').textContent = flowMode() === 'electrons' ? 'Blue dots = electrons, moving − → + · faster = more current' : 'Yellow dots = current, flowing + → − · faster = more current';
}
function updateClock() {
  const c = $('simclock');
  const t = sim ? `${(sim.timeUs / 1e6).toFixed(1)} s` : '';
  c.className = `pill${running ? ' run' : sim ? ' pause' : ''}`;
  c.textContent = running ? `Running · ${t}${lagging ? ' (slow)' : ''}` : sim ? `Paused · ${t}` : 'Stopped';
}

let lastUi = 0;
function frame(now) {
  if (!running || !sim) return;
  const speed = Number($('speed').value);
  const dt = Math.min(50, now - lastFrame) * speed;
  lastFrame = now;
  displayUs += dt * 1000;
  const budget = performance.now() + 12;
  try {
    while (sim.timeUs < displayUs + 40000 && performance.now() < budget) { sim.advance(2); sampleGraph(); }
  } catch (err) {
    toast(`Simulation stopped: ${err.message}`);
    pauseRun();
    return;
  }
  lagging = sim.timeUs < displayUs;
  if (lagging) displayUs = sim.timeUs;
  showFrame(displayUs);
  paintFlow(dt / 1000 / Math.max(speed, 0.25));
  if (now - lastUi > 250) { lastUi = now; liveUi(); }
  if (tab === 'graph' && now - graph.drawnAt > 40) { graph.drawnAt = now; drawGraph(); }
  requestAnimationFrame(frame);
}

// Show the newest recorded frame that is not ahead of the display clock.
function showFrame(t) {
  const fr = sim.frames;
  let f = null;
  for (let i = fr.length - 1; i >= 0; i--) if (fr[i].t <= t) { f = fr[i]; break; }
  if (!f) f = fr[0];
  if (f) { applyVisuals(f.vis); flowNow = f.flow || null; }
}

function applyVisuals(vis) {
  for (const [id, state] of Object.entries(vis)) {
    const v = views.get(id);
    if (!v || !state) continue;
    const key = JSON.stringify(state);
    if (key === v.visKey) continue;
    v.visKey = key;
    if (v.custom) paintCustom(partOf(id), v, state);
    else if (v.inner) for (const [k, val] of Object.entries(state)) v.inner[k] = val;
  }
}

function resetVisuals() {
  for (const p of doc.parts) {
    const v = views.get(p.id);
    if (!v) continue;
    v.visKey = '';
    if (v.custom) paintCustom(p, v, null);
    else if (v.inner) {
      for (const k of ['value', 'brightness', 'ledRed', 'ledGreen', 'ledBlue', 'hasSignal', 'led1', 'led13', 'ledPower']) {
        if (k in v.inner && typeof v.inner[k] === 'boolean') v.inner[k] = false;
      }
    }
  }
}

function allIssues() {
  const out = new Map();
  if (!doc) return [];
  const add = (it) => { const k = issueKey(it.part, it.text); if (!out.has(k)) out.set(k, it); };
  try { for (const it of new Bench(clone(doc), LIB, { firmware: FW }).staticIssues()) add(it); } catch (err) { add({ level: 'fail', part: '', text: err.message }); }
  for (const p of doc.parts) {
    if (!doc.wires.some((w) => w.a.part === p.id || w.b.part === p.id)) add({ level: 'warn', part: p.id, type: p.type, text: 'Not wired to anything yet', fix: 'Click one of its pins, then the pin it should connect to.' });
  }
  for (const it of lastCheck?.issues || []) add(it);
  if (sim) for (const it of sim.issues.values()) add(it);
  return [...out.values()];
}

function liveUi() {
  updateClock();
  const issues = allIssues();
  const worst = new Map();
  const rank = { fail: 2, warn: 1 };
  for (const it of issues) if (rank[it.level] > (rank[worst.get(it.part)] || 0)) worst.set(it.part, it.level);
  for (const p of doc.parts) {
    const v = views.get(p.id);
    const lv = worst.get(p.id);
    v.badge.hidden = !lv;
    if (lv) { v.badge.className = `badge ${lv}`; v.badge.textContent = lv === 'fail' ? '!' : '?'; }
  }
  paintTabs(issues);
  if (tab === 'inspect' && sel?.kind === 'part') paintReadings();
  if (tab === 'checks') renderSide();
  if (tab === 'phone') phoneTick();
  refreshGuide();
}

// Run the circuit for 5 simulated seconds without drawing, to collect problems.
function quickCheck() {
  try {
    const s = new Bench(clone(doc), LIB, { firmware: FW });
    const t0 = performance.now();
    while (s.timeUs < 5e6 && performance.now() - t0 < 4000) s.advance(50);
    lastCheck = { issues: [...s.issues.values()], seconds: s.timeUs / 1e6, ran: true };
  } catch (err) {
    lastCheck = { issues: [{ level: 'fail', part: '', text: `Simulation error: ${err.message}` }], seconds: 0 };
  }
  renderSide();
  liveUi();
}

// ---------- guide: steps, targets, what next ----------
const exampleOf = () => EXAMPLES.find((x) => x.id === doc?.exampleId);
const pinName = (type, pin) => {
  if (type === 'wokwi-led') return pin === 'A' ? 'A (long leg)' : pin === 'C' ? 'C (short leg)' : pin;
  if (/^\d+$/.test(pin) && type !== 'wokwi-arduino-uno') return `pin ${pin}`;
  return pin;
};

// Build steps for an example: each part (and its settings), each wire, then Run.
function guideSteps(ex) {
  const steps = [];
  for (const p of ex.parts) {
    const def = LIB[p.type];
    steps.push({ kind: 'add', id: p.id, type: p.type, text: `Add ${/^(LED|[AEIOU])/.test(def.name) ? 'an' : 'a'} ${def.name}`, sub: `It will be called ${p.id}. ${PART_INFO[p.type]?.about.split('. ')[0] || ''}.` });
    for (const [k, v] of Object.entries(p.props || {})) {
      const spec = def.props?.[k];
      if (!spec || String(defaults(def)[k]) === String(v)) continue;
      const opt = spec.options?.find(([ov]) => String(ov) === String(v));
      steps.push({ kind: 'prop', id: p.id, k, v, text: `Set ${p.id} ${spec.label.toLowerCase()} to ${opt ? opt[1] : `${v}${spec.unit ? ` ${spec.unit}` : ''}`}`, sub: 'Select the part, then change it in the Inspect tab.' });
    }
  }
  ex.wires.forEach((w, i) => {
    const ta = ex.parts.find((p) => p.id === w.a.part)?.type;
    const tb = ex.parts.find((p) => p.id === w.b.part)?.type;
    const da = pinInfo(ta, w.a.pin);
    steps.push({ kind: 'wire', i, a: w.a, b: w.b, color: w.color, text: `Wire ${w.a.part} ${pinName(ta, w.a.pin)} → ${w.b.part} ${pinName(tb, w.b.pin)}`, sub: `Click the pulsing pin on ${w.a.part}, then the one on ${w.b.part}.${da ? ` (${w.a.part} ${w.a.pin}: ${da})` : ''}` });
  });
  steps.push({ kind: 'run', text: 'Press ▶ Run', sub: ex.run || 'Watch it work.' });
  return steps;
}

function stepDone(st) {
  if (st.kind === 'add') return partOf(st.id)?.type === st.type;
  if (st.kind === 'prop') { const p = partOf(st.id); return !!p && String(propsOf(p)[st.k]) === String(st.v); }
  if (st.kind === 'wire') return !!partOf(st.a.part) && !!partOf(st.b.part) && netWires(`${st.a.part}:${st.a.pin}`).pins.has(`${st.b.part}:${st.b.pin}`);
  if (st.kind === 'run') return !!sim && sim.timeUs > 1.5e6;
  return false;
}

function guideState() {
  const ex = exampleOf();
  if (!ex) return null;
  const steps = guideSteps(ex);
  const done = steps.map(stepDone);
  const cur = done.indexOf(false);
  return { ex, steps, done, cur };
}

// Pins (and shelf items) to point at for the current guided step.
function guideTargets() {
  const out = new Set();
  if (!doc?.guided) return out;
  const g = guideState();
  const st = g && g.cur >= 0 ? g.steps[g.cur] : null;
  if (st?.kind === 'wire') { out.add(`${st.a.part}:${st.a.pin}`); out.add(`${st.b.part}:${st.b.pin}`); }
  return out;
}

let lastGuideKey = '';
function refreshGuide() {
  const bar = $('guidebar');
  const g = doc?.guided ? guideState() : null;
  for (const b of shelfEl.querySelectorAll('.item.target')) b.classList.remove('target');
  for (const v of views.values()) v.div.classList.remove('target');
  $('runBtn').classList.remove('pulse');
  if (!g) { bar.hidden = true; return; }
  const st = g.cur >= 0 ? g.steps[g.cur] : null;
  if (st?.kind === 'add') shelfEl.querySelector(`.item[data-type="${CSS.escape(st.type)}"]`)?.classList.add('target');
  if (st?.kind === 'prop') views.get(st.id)?.div.classList.add('target');
  if (st?.kind === 'run') $('runBtn').classList.add('pulse');
  const key = `${g.cur}|${doc.guideHidden ? 1 : 0}`;
  if (key !== lastGuideKey) {
    lastGuideKey = key;
    renderWires();
    if (tab === 'guide') renderSide();
  }
  bar.hidden = !!doc.guideHidden;
  if (bar.hidden) return;
  if (!st) {
    bar.innerHTML = `<div class="gstep">Built and running ✓</div><div>${esc(g.ex.name)} works. See <b>Guide</b> for what to try next.</div>
      <div class="row"><button data-act="guide-next-tab" class="primary">What to try next</button><button data-act="guide-hide">Close</button></div>`;
    return;
  }
  const where = st.kind === 'add' ? (narrow.matches ? ' It is highlighted in the Parts tab.' : ' It is highlighted in the list on the left.') : '';
  bar.innerHTML = `<div class="gstep">Step ${g.cur + 1} of ${g.steps.length}</div><div><b>${esc(st.text)}</b></div><div class="muted" style="font-size:12.5px">${esc(st.sub || '')}${where}</div>
    <div class="row"><button data-act="guide-do" class="primary">${st.kind === 'run' ? '▶ Run' : 'Do it for me'}</button><button data-act="guide-hide">Hide</button></div>`;
}

async function guideDo() {
  const g = guideState();
  const st = g && g.cur >= 0 ? g.steps[g.cur] : null;
  if (!st) return;
  if (st.kind === 'add') await addPart(st.type);
  else if (st.kind === 'prop') setProp(st.id, st.k, st.v);
  else if (st.kind === 'wire') {
    pushHistory();
    const exW = g.ex.wires[st.i];
    doc.wires.push({ a: { ...st.a }, b: { ...st.b }, color: st.color || 'green', pts: clone(exW.pts || []) });
    changed(true);
  } else if (st.kind === 'run') startRun();
  refreshGuide();
}

function startGuidedBuild(ex) {
  loadDoc({ name: `${ex.name} (my build)`, note: ex.note, exampleId: ex.id, guided: true, parts: [], wires: [] }, 'Build it step by step: follow the yellow box');
  tab = 'guide';
}

// Suggestions for any circuit, from its current state.
function nextSteps() {
  const out = [];
  if (!doc.parts.length) return ['Add a board (ESP32 or Arduino Uno) or a battery from the parts list.', 'Or open Examples and pick “LED + resistor on a 9 V battery”.'];
  const unwired = doc.parts.filter((p) => !doc.wires.some((w) => w.a.part === p.id || w.b.part === p.id));
  if (unwired.length) out.push(`Wire ${unwired.map((p) => p.id).join(', ')}: click one of its pins, then the pin it should connect to.`);
  const issues = allIssues();
  const fails = issues.filter((i) => i.level === 'fail');
  if (!sim) out.push('Press ▶ Run to power the circuit and watch the current flow.');
  if (fails.length) out.push(`Open Checks: ${fails.length} problem${fails.length > 1 ? 's' : ''} to fix before buying.`);
  else if (sim && sim.timeUs > 2e6) out.push('Open Parts list to see what to buy and the estimated cost.');
  if (!doc.parts.some((p) => LIB[p.type].mcu)) out.push('Add an ESP32 or Uno to control things with a sketch.');
  out.push('Save your work with File → Save, or export to Wokwi.');
  return out;
}

function guideHtml() {
  const g = guideState();
  const nexts = nextSteps();
  const nextCard = `<div class="card"><h4>What to do next</h4><ul class="next" style="padding-left:18px;margin:0">${nexts.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
  if (!g) {
    return `<h3>${esc(doc.name || 'Untitled circuit')}</h3>${doc.note ? `<p>${esc(doc.note)}</p>` : ''}${nextCard}
      <div class="card"><h4>Learn by building</h4><p style="margin:0 0 6px">Pick an example; the guide walks you through placing every part and wire, then checks it works.</p>
      ${EXAMPLES.map((ex) => `<div class="row" style="justify-content:space-between;margin:4px 0"><span>${esc(ex.name)}</span><span class="row"><button data-act="ex-open" data-ex="${ex.id}">Open</button><button data-act="ex-build" data-ex="${ex.id}" class="primary">Build step by step</button></span></div>`).join('')}</div>
      ${howToHtml()}`;
  }
  const doneN = g.done.filter(Boolean).length;
  const steps = g.steps.map((st, i) => `<li class="${g.done[i] ? 'done' : ''}${i === g.cur && doc.guided ? ' cur' : ''}"><span class="ck">${g.done[i] ? '✓' : i + 1}</span><span>${esc(st.text)}${i === g.cur && doc.guided ? `<div class="muted" style="font-size:12.5px">${esc(st.sub || '')}</div>` : ''}</span></li>`).join('');
  return `<h3>${esc(g.ex.name)}</h3>
    <div class="card"><h4>How it works</h4><p style="margin:0">${esc(g.ex.learn || g.ex.note || '')}</p></div>
    ${doc.guided ? `<div class="row" style="justify-content:space-between"><b>Build steps · ${doneN} of ${g.steps.length} done</b>${g.cur >= 0 ? '<button data-act="guide-do" class="primary">Do the next step for me</button>' : ''}</div>`
    : `<div class="row" style="justify-content:space-between"><b>How it is built</b><button data-act="ex-build" data-ex="${g.ex.id}" class="primary">Build it myself, step by step</button></div>`}
    <ol class="steps">${steps}</ol>
    ${doc.guided && doc.guideHidden ? '<button data-act="guide-show">Show the step box on the board</button>' : ''}
    <div class="card"><h4>Try next</h4><ul class="next" style="padding-left:18px;margin:0">${(g.ex.next || []).map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>
    ${nextCard}`;
}

function howToHtml() {
  return `<div class="card"><h4>How to use the board</h4><ul style="padding-left:18px;margin:0">
    <li><b>Add</b>: pick a part from the ${narrow.matches ? '<b>Parts</b> tab' : 'list on the left'}, then drag it into place.</li>
    <li><b>Wire</b>: click a pin, then another pin. Click empty space on the way to add bends.</li>

function propControl(id, k, spec, val) {
  const name = `${id}|${k}`;
  if (spec.type === 'select') {

    return `<select data-prop="${esc(name)}" data-numeric="${spec.numeric ? 1 : ''}">${opts.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(val) ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  }
  if (spec.type === 'bool') return `<input type="checkbox" data-prop="${esc(name)}"${val ? ' checked' : ''}>`;
  if (spec.type === 'range') return `<div class="row" style="flex-wrap:nowrap"><input type="range" data-prop="${esc(name)}" min="${spec.min}" max="${spec.max}" step="${spec.step || 1}" value="${val}"><span data-out="${esc(name)}" style="min-width:52px;text-align:right">${val}${spec.unit ? ` ${spec.unit}` : ''}</span></div>`;
  return `<div class="row" style="flex-wrap:nowrap"><input type="number" data-prop="${esc(name)}" min="${spec.min ?? ''}" max="${spec.max ?? ''}" step="${spec.step || 'any'}" value="${val}" style="width:90px">${spec.unit ? `<span class="muted">${esc(spec.unit)}</span>` : ''}</div>`;
}

function bomLines() {
  const lines = new Map();
  const add = (key, line) => { const cur = lines.get(key); if (cur) { cur.qty += line.qty; if (line.covers) cur.covers.push(...line.covers); } else lines.set(key, { ...line, covers: line.covers || [] }); };
  for (const p of doc.parts) {
    const def = LIB[p.type];
    const b = typeof def.bom === 'function' ? def.bom(propsOf(p)) : def.bom;
    if (!b) continue;
    if (b.kit) add(`kit:${b.kit}`, { label: b.kit, search: b.search, inr: b.kitInr, qty: 1, kit: true, covers: [b.label] });
    else add(b.label, { label: b.label, search: b.search, inr: b.inr, qty: 1 });
  }
  for (const l of lines.values()) if (l.kit) l.qty = 1;
  if (doc.wires.length) add('jumpers', { label: 'Jumper wires (male–male and male–female, 40 each)', search: 'jumper wires male to male male to female 40 pcs', inr: [100, 180], qty: 1 });
  const small = doc.parts.some((p) => !LIB[p.type].mcu && !String(p.type).startsWith('bench-battery'));
  if (small) add('breadboard', { label: 'Breadboard (830 points)', search: 'breadboard 830 points', inr: [80, 150], qty: 1 });
  return [...lines.values()];
}

    return `<tr><td class="num">${l.qty}</td><td>${esc(l.label)}${covers}<div style="font-size:12px"><a href="https://www.amazon.in/s?k=${q}" target="_blank" rel="noopener">Amazon.in</a> · <a href="https://www.amazon.com/s?k=${q}" target="_blank" rel="noopener">Amazon.com</a></div></td><td class="num">₹${l.inr ? `${l.inr[0] * l.qty}–${l.inr[1] * l.qty}` : '?'}</td></tr>`;

// ---------- code ----------
const SKETCH_SRC = globalThis.SKETCH_SRC || {};
const SHIM_SRC = globalThis.SHIM_SRC || {};
let codeBoard = null;
function highlight(src) {
  const KW = /^(void|int|long|unsigned|float|double|bool|char|const|static|uint8_t|uint16_t|uint32_t|int32_t|if|else|for|while|do|return|switch|case|break|default|true|false|String|struct|auto|HIGH|LOW|INPUT|OUTPUT|INPUT_PULLUP)$/;
  const FN = /^(pinMode|digitalWrite|digitalRead|analogRead|analogWrite|delay|delayMicroseconds|millis|micros|pulseIn|ledcAttach|ledcWrite|constrain|map|random|setup|loop)$/;
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(^[ \t]*#[^\n]*)|\b(0x[0-9a-fA-F]+|\d+(?:\.\d+)?[fFuUlL]*)\b|\b([A-Za-z_]\w*)\b/gm;
  let out = '';
  let last = 0;
  src.replace(re, (m, com, str, pre, num, word, off) => {
    out += esc(src.slice(last, off));
    last = off + m.length;
    if (com) out += `<span class="c-com">${esc(m)}</span>`;
    else if (str) out += `<span class="c-str">${esc(m)}</span>`;
    else if (pre) out += `<span class="c-pre">${esc(m)}</span>`;
    else if (num) out += `<span class="c-num">${esc(m)}</span>`;
    else if (KW.test(word)) out += `<span class="c-kw">${esc(m)}</span>`;
    else if (FN.test(word) || word === 'Serial') out += `<span class="c-fn">${esc(m)}</span>`;
    else out += esc(m);
    return m;
  });
  return out + esc(src.slice(last));
}

// Edited-but-not-flashed text, per board and program, kept in this browser.
const drafts = (() => { try { return JSON.parse(store.get('circuit-bench-drafts') || '{}') || {}; } catch { return {}; } })();

const codeState = { busy: false, status: '', errors: [], log: '', errFor: '' };
const boardKind = (p) => (p.type === 'wokwi-arduino-uno' ? 'uno' : 'esp32');
const NEW_SKETCH = (kind) => `// My sketch: blinks the on-board LED and prints to Serial.
// Change it, then press Compile & Flash.

}

    <select data-prop="${esc(p.id)}|firmware" aria-label="Program">${opts.map(([v, l]) => `<option value="${esc(v)}"${v === fw ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></div>`;

    <div class="row" style="margin:6px 0">
      <button class="primary" data-act="code-flash" id="flashBtn"${codeState.busy ? ' disabled' : ''}>⚡ Compile &amp; Flash</button>

      ${edited ? '<button data-act="code-original">Back to original</button>' : ''}

    </div>

    <div class="editor"><pre class="code" aria-hidden="true"><code id="codeHl"></code></pre><textarea id="codeTa" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" aria-label="Sketch code"></textarea></div>
    <div class="card"><h4>How it works</h4><p style="margin:0">Ctrl+S (⌘S) also compiles and flashes. The first compile downloads the compiler (open-source clang, about 100 MB, once; your browser keeps it). Supported: pinMode, digitalWrite/Read, analogRead/Write, ledc PWM, pulseIn, millis, delay, Serial (print, println, printf, read), String, map, random, and the ESP32 Wi-Fi hotspot with WebServer. Not yet: other libraries (Servo, Wire/I²C, SPI) and interrupts.</p></div>`;
}
function codeStatusHtml() {
  const errs = codeState.errors.filter((e) => e.board === codeBoard);
  const list = errs.length ? `<ul class="errs">${errs.slice(0, 12).map((e) => `<li><button class="link ${e.level}" data-act="code-goto" data-line="${e.line}" data-col="${e.col}">Line ${e.line}: ${esc(e.text)}</button></li>`).join('')}</ul>` : '';
  return `${codeState.status ? `<div>${codeState.status}</div>` : ''}${list}`;
}
function paintCodeStatus() { const el = $('codeStatus'); if (el) el.innerHTML = codeStatusHtml(); const b = $('flashBtn'); if (b) b.disabled = codeState.busy; }
function paintHighlight() {
  const ta = $('codeTa');
  if (!ta) return;
  const bad = new Map();

// Arduino-style function prototypes, so functions can be used before they are
// defined (the Arduino IDE does the same). Line numbers stay unchanged.
function addPrototypes(src, file) {
  const blank = (m) => m.replace(/[^\n]/g, ' ');
  const clean = src
    .replace(/R"([^(\s]*)\(([\s\S]*?)\)\1"/g, blank)
    .replace(/\/\*[\s\S]*?\*\//g, blank)
    .replace(/\/\/[^\n]*/g, blank)
    .replace(/"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'/g, blank);
  const protos = [];
  let first = -1;
  let depth = 0;
  let lineStart = 0;
  const lines = clean.split('\n');
  for (let i = 0; i < lines.length; i++) {
    if (depth === 0 && !/^\s*#/.test(lines[i])) {
      const rest = lines.slice(i, i + 3).join(' ');
      const m = rest.match(/^\s*((?:static\s+|inline\s+)*(?:unsigned\s+|signed\s+|const\s+)*[A-Za-z_]\w*(?:<[^<>;{}()]*>)?[\s*&]+)([A-Za-z_]\w*)\s*\(([^(){};=]*)\)\s*\{/);
      if (m && !/^(if|for|while|switch|return|else|do|struct|class|enum|union|typedef|namespace|template|using|new|delete)$/.test(m[2])
        && !/\b(return|else|typedef|template)\b/.test(m[1])) {
        protos.push(`${m[1].trim()} ${m[2]}(${m[3].replace(/\s+/g, ' ').trim()});`);
        if (first < 0) first = i;
      }
    }
    for (const ch of lines[i]) { if (ch === '{') depth++; else if (ch === '}') depth = Math.max(0, depth - 1); }
    lineStart += lines[i].length + 1;
  }
  if (first < 0 || !protos.length) return src;
  const out = src.split('\n');
  out.splice(first, 0, `${protos.join(' ')}`, `#line ${first + 1} "${file}"`);
  return out.join('\n');
}

const CLANG_URLS = [globalThis.BENCH_CLANG_URL,
  'https://cdn.jsdelivr.net/npm/@yowasp/clang@21.1.4-3/gen/bundle.js',
  'https://unpkg.com/@yowasp/clang@21.1.4-3/gen/bundle.js'].filter(Boolean);

function loadClang() {

    clangP = (async () => {
      let last;
      for (const u of CLANG_URLS) { try { return await import(u); } catch (err) { last = err; } }
      throw last;
    })();

  }

}

  const files = { ...SHIM_SRC, [file]: addPrototypes(src, file) };

    return { wasm: out['fw.wasm'] || null, log };

const mb = (n) => (n / 1048576).toFixed(0);
async function compileAndFlash() {
  if (codeState.busy || !codeBoard) return;
  const p = partOf(codeBoard);
  if (!p) return;
  rememberEditor();
  const kind = boardKind(p);
  const fw = propsOf(p).firmware;
  const base = fw?.startsWith('edit-') ? doc.firmware?.[fw]?.base || '' : fw || '';
  const baseLabel = base ? (LIB[p.type].props.firmware.options.find(([v]) => v === base)?.[1] || customFw.get(base) || base) : 'new sketch';
  const src = $('codeTa')?.value ?? editorText(p);
  const file = `${(base || 'sketch').replace(/[^\w-]/g, '_')}.ino`;
  const board = p.id;
  codeState.busy = true;
  codeState.errors = codeState.errors.filter((e) => e.board !== board);
  codeState.status = clangP ? 'Compiling…' : 'Loading the compiler…';
  paintCodeStatus();
  const t0 = performance.now();
  try {
    const { wasm, log } = await compileSketch(src, kind, file, ({ doneLength, totalLength }) => {
      codeState.status = doneLength < totalLength
        ? `Downloading the compiler: ${Math.round((100 * doneLength) / totalLength)} % of ${mb(totalLength)} MB (first time only)…`
        : 'Starting the compiler…';
      paintCodeStatus();
    });
    codeState.log = log;
    const found = parseLog(log, file, board);
    codeState.errors = codeState.errors.concat(found);
    if (!wasm) {
      const n = found.filter((e) => e.level === 'fail').length;
      codeState.status = `<span class="bad">✗ Not flashed: ${n || 'some'} error${n === 1 ? '' : 's'}.</span> Click one to jump to the line. The board keeps its old program.`;
      return;

    const names = WebAssembly.Module.exports(mod).map((x) => x.name);
    if (!names.includes('setup') || !names.includes('loop')) {
      codeState.status = '<span class="bad">✗ Not flashed: the sketch needs both setup() and loop().</span>';
      return;
    }
    const id = `edit-${board}`;
    const label = `${board}: my ${baseLabel}`;
    FW[`${id}.${kind}`] = mod;
    customFw.set(id, label);
    delete drafts[`${board}|${fw || ''}`];
    delete drafts[`${board}|${id}`];
    saveDrafts();
    pushHistory();
    doc.firmware = { ...(doc.firmware || {}), [id]: { kind, label, b64: bytesToB64(wasm), src, base } };
    p.props = { ...p.props, firmware: id };
    save();
    lastCheck = null;
    editorView.board = draftKey(p);
    const warns = found.filter((e) => e.level === 'warn').length;
    codeState.status = `<span class="good">✓ Flashed to ${esc(board)}</span> in ${((performance.now() - t0) / 1000).toFixed(1)} s (${wasm.length.toLocaleString()} bytes)${warns ? `, ${warns} warning${warns === 1 ? '' : 's'}` : ''}. The board restarted with the new program.`;
    restartSim();
    if (!running) startRun();
    updateRunBtn();
  } catch (err) {
    codeState.status = `<span class="bad">✗ Could not load the compiler: ${esc(err.message || String(err))}.</span> It downloads from cdn.jsdelivr.net, so check your connection and try again. Without it you can still build with build.sh and use “Upload your own sketch”.`;

}

// Probes record pin voltages and part readings while the circuit runs, like
// an oscilloscope with one lane per channel. Numbers printed on Serial can be
// plotted too (Arduino serial-plotter style: "a:1 b:2" or "1 2").
const GRAPH_COLORS = ['#1f6feb', '#d1242f', '#1a7f37', '#bf8700', '#8250df', '#0a7ea4', '#c2185b', '#6e7781'];

function sampleGraph() {
  if (!sim || graph.frozen) return;
  const probes = probesOf();
  if (!probes.length) return;
  const step = Math.max(1000, (graph.windowS * 1e6) / 1500);
  if (graph.lastUs >= 0 && sim.timeUs - graph.lastUs < step) return;
  graph.lastUs = sim.timeUs;
  const t = sim.timeUs;
  const reads = new Map();
  for (const pr of probes) {
    if (pr.kind === 'pin') {
      const n = sim.node(pr.part, pr.pin);
      const v = n < 0 || sim.floating[n] ? NaN : sim.V[n];
      pushPoint(probeKey(pr), t, v, Number.isNaN(v) ? 'floating' : `${v.toFixed(2)} V`);
    } else {
      if (!reads.has(pr.part)) { try { reads.set(pr.part, sim.readings(pr.part)); } catch { reads.set(pr.part, []); } }
      const row = reads.get(pr.part).find(([k]) => k === pr.key);
      pushPoint(probeKey(pr), t, row ? readingNumber(row[1]) : NaN, row ? row[1] : '');
    }
  }

  const buf = (graph.serialLine.get(id) || '') + text;
  const lines = buf.split('\n');
  graph.serialLine.set(id, lines.pop().slice(-500));
  for (const line of lines) {
    const pairs = [...line.matchAll(/([A-Za-z_][\w]*)\s*[:=]\s*(-?\d+(?:\.\d+)?)/g)];
    const vals = pairs.length ? pairs.map((m) => [m[1], Number(m[2])]) : [...line.matchAll(/-?\d+(?:\.\d+)?/g)].map((m, i) => [`value${i + 1}`, Number(m[0])]);

  for (const key of graph.data.keys()) {

  for (const p of doc.parts) {
    for (const pin of Object.keys(views.get(p.id)?.pins || {})) if (!/^GND/.test(pin)) pins.push([`pin|${p.id}|${pin}`, `${p.id}.${pin}`]);

}

      <label>Window <select id="graphWin">${[[0.05, '50 ms'], [0.2, '0.2 s'], [1, '1 s'], [5, '5 s'], [20, '20 s']].map(([v, l]) => `<option value="${v}"${v === graph.windowS ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
      ${boards.length ? `<label>Serial plotter <select id="plotSerial"><option value="">off</option>${boards.map((b) => `<option${doc.plotSerial === b.id ? ' selected' : ''}>${esc(b.id)}</option>`).join('')}</select></label>` : ''}
      <button data-act="graph-freeze">${graph.frozen ? '▶ Resume graph' : '⏸ Freeze graph'}</button><button data-act="graph-clear">Clear</button>
    </div>
    <div id="graphBox" class="graphbox"><canvas id="graphCv" aria-label="Graph of probes over time"></canvas></div>
    <div class="sub" id="graphHint"></div>`;
}
function drawGraph() {
  const cv = $('graphCv');
  if (!cv) return;
  const lanes = graphLanes();
  const hint = $('graphHint');
  if (hint) hint.textContent = !lanes.length ? 'No probes yet. Add one above, or press “Pick a pin” and click any pin. Probes are saved with the project.'
    : !sim ? 'Press ▶ Run to start recording.' : 'Each lane has its own scale (min and max on the left). PWM pins show the average voltage. × removes a probe.';
  const css = getComputedStyle(document.documentElement);
  const ink = css.getPropertyValue('--ink').trim() || '#1c2128';
  const muted = css.getPropertyValue('--muted').trim() || '#5d6673';
  const line = css.getPropertyValue('--line').trim() || '#d8dde3';
  const W = cv.parentElement.clientWidth;
  const laneH = 78;
  const H = Math.max(1, lanes.length) * laneH + 22;
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.height = `${H}px`; }
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const L = 54;
  const R = W - 8;
  const tEnd = graph.frozen ? graph.frozenAt || 0 : sim ? Math.min(sim.timeUs, Math.max(displayUs, 0) || sim.timeUs) : 0;
  const tStart = tEnd - graph.windowS * 1e6;
  g.font = '11px system-ui, sans-serif';
  graph.boxes = [];
  lanes.forEach((ln, i) => {
    const top = i * laneH;
    const y0 = top + 18;
    const y1 = top + laneH - 6;
    const s = graph.data.get(ln.key);
    let lo = Infinity;
    let hi = -Infinity;
    if (s) for (let j = 0; j < s.t.length; j++) if (s.t[j] >= tStart && s.t[j] <= tEnd && Number.isFinite(s.v[j])) { lo = Math.min(lo, s.v[j]); hi = Math.max(hi, s.v[j]); }
    if (!Number.isFinite(lo)) { lo = 0; hi = 1; }
    if (hi - lo < 1e-6) { const m = Math.max(Math.abs(hi) * 0.1, 0.05); lo -= m; hi += m; }
    const [labLo, labHi] = [lo, hi];
    const pad = (hi - lo) * 0.08;
    lo -= pad; hi += pad;
    g.strokeStyle = line; g.lineWidth = 1;
    g.beginPath(); g.moveTo(L, y1 + 0.5); g.lineTo(R, y1 + 0.5); g.moveTo(L + 0.5, y0); g.lineTo(L + 0.5, y1); g.stroke();
    g.fillStyle = ln.color; g.fillRect(4, top + 6, 8, 8);
    g.fillStyle = ink; g.textAlign = 'left';
    g.fillText(`${ln.label}${s?.text ? `  ·  ${s.text}` : ''}`, 16, top + 13);
    if (ln.probe !== undefined) { g.fillStyle = muted; g.textAlign = 'right'; g.fillText('×', R, top + 13); graph.boxes.push({ x0: R - 14, x1: R + 6, y0: top, y1: top + 18, probe: ln.probe }); }
    g.fillStyle = muted; g.textAlign = 'right';
    const fmt = (v) => (Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2));
    g.fillText(fmt(labHi), L - 4, y0 + 8); g.fillText(fmt(labLo), L - 4, y1);
    if (!s || !s.t.length) return;
    g.strokeStyle = ln.color; g.lineWidth = 1.6; g.beginPath();
    let pen = false;
    const X = (t) => L + ((t - tStart) / (tEnd - tStart)) * (R - L);
    const Y = (v) => y1 - ((v - lo) / (hi - lo)) * (y1 - y0);
    const step = ln.key.startsWith('ser:');
    let prevY = 0;
    for (let j = 0; j < s.t.length; j++) {
      const t = s.t[j];
      if (t < tStart && !(s.t[j + 1] >= tStart)) continue;
      if (t > tEnd) break;
      const v = s.v[j];
      if (!Number.isFinite(v)) { pen = false; continue; }
      const x = Math.max(L, X(t));
      const y = Y(v);
      if (!pen) { g.moveTo(x, y); pen = true; } else { if (step) g.lineTo(x, prevY); g.lineTo(x, y); }
      prevY = y;
    }
    g.stroke();
  });
  g.fillStyle = muted; g.textAlign = 'left';
  const wl = graph.windowS >= 1 ? `${graph.windowS} s` : `${graph.windowS * 1000} ms`;
  g.fillText(`−${wl}`, L, H - 6);
  g.textAlign = 'right';
  g.fillText(sim ? `now (${(tEnd / 1e6).toFixed(2)} s)` : 'now', R, H - 6);
}
$('tabBody').addEventListener('click', (e) => {
  if (e.target.id !== 'graphCv') return;
  const r = e.target.getBoundingClientRect();
  const x = e.clientX - r.left;
  const y = e.clientY - r.top;
  const hit = (graph.boxes || []).find((b) => x >= b.x0 && x <= b.x1 && y >= b.y0 && y <= b.y1);

tabBody.addEventListener('click', (e) => {

// Inside claude.ai the page saves through the viewer's downloads capability;
// opened as a plain file it uses an ordinary browser download.
let dlCap;
const dlReady = (globalThis.claude?.use ? globalThis.claude.use('downloads') : Promise.resolve(null)).then((d) => { dlCap = d; }, () => { dlCap = null; });
async function download(name, text, type) {
  await dlReady;
  if (dlCap) {
    try { await dlCap.save({ filename: name, data: text }); } catch (err) { if (err?.code !== 'declined') toast(`Could not save: ${err?.message || err}. Use Copy instead.`); }
    return;
  }
  if (globalThis.claude) { toast('Saving is not available here. Use Copy instead.'); return; }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (err) { toast(`Download blocked: ${err.message}. Use Copy instead.`); }
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('Copied'); } catch {
    const ta = $('dlgText');
    if (ta) { ta.select(); toast('Press Ctrl+C / ⌘C to copy'); } else toast('Copy is blocked here');
  }
}

function loadText(text, kind) {
  let data;
  try { data = JSON.parse(text); } catch (err) { toast(`Not valid JSON: ${err.message}`); return; }
  if (kind === 'wokwi' || (data.connections && data.parts && !data.wires)) { importWokwi(data); return; }
  if (!Array.isArray(data.parts) || !Array.isArray(data.wires)) { toast('This file is not a Circuit Bench project'); return; }
  const unknown = data.parts.filter((p) => !LIB[p.type]);
  data.parts = data.parts.filter((p) => LIB[p.type]);
  loadDoc(data, unknown.length ? `${unknown.length} unknown part(s) skipped` : 'Project loaded');
}

function loadDoc(d, msg) {

    parts: d.parts.map((p) => ({ rot: 0, props: {}, ...p })), wires: d.wires.map((w) => ({ pts: [], ...w })), firmware: d.firmware || {},
    probes: Array.isArray(d.probes) ? d.probes : [], plotSerial: d.plotSerial || undefined,

// Wokwi diagram.json: same part names and pin names for the parts both tools have.
function importWokwi(d) {
  const parts = [];
  const skipped = [];
  for (const wp of d.parts || []) {
    const def = LIB[wp.type];
    if (!def) { skipped.push(wp.type); continue; }
    const props = {};
    for (const [k, spec] of Object.entries(def.props || {})) {
      const a = wp.attrs?.[k];
      if (a === undefined) continue;
      props[k] = spec.type === 'bool' ? a === '1' || a === 'true' : (spec.type === 'select' && !spec.numeric) ? a : Number(a);
    }
    parts.push({ id: wp.id, type: wp.type, x: Number(wp.left) || 0, y: Number(wp.top) || 0, rot: Number(wp.rotate) || 0, props });
  }
  const ids = new Set(parts.map((p) => p.id));
  const wires = [];
  for (const c of d.connections || []) {
    const [a, b, color] = c;
    const sp = (s) => { const i = String(s).indexOf(':'); return { part: s.slice(0, i), pin: s.slice(i + 1) }; };
    const A = sp(a); const B = sp(b);
    if (ids.has(A.part) && ids.has(B.part)) wires.push({ a: A, b: B, color: color || 'green', pts: [] });
  }
  const name = d.author ? `Wokwi diagram by ${d.author}` : 'Imported Wokwi diagram';
  loadDoc({ name, parts, wires, note: 'Imported from Wokwi. Pick the firmware for each board in the inspector.' },
    skipped.length ? `Imported. Not supported yet: ${[...new Set(skipped)].join(', ')}` : 'Wokwi diagram imported');
}

function exportWokwi() {
  const parts = [];
  let skipped = 0;
  for (const p of doc.parts) {
    if (!p.type.startsWith('wokwi-')) { skipped++; continue; }
    const def = LIB[p.type];
    const props = propsOf(p);
    const attrs = { ...(def.attrs?.(props) || {}) };
    if (p.type === 'wokwi-resistor') attrs.value = String(props.value);
    parts.push({ type: p.type, id: p.id, top: p.y, left: p.x, ...(p.rot ? { rotate: p.rot } : {}), attrs });
  }
  const ok = new Set(parts.map((p) => p.id));
  const connections = doc.wires.filter((w) => ok.has(w.a.part) && ok.has(w.b.part)).map((w) => [`${w.a.part}:${w.a.pin}`, `${w.b.part}:${w.b.pin}`, w.color || 'green', []]);
  const out = { version: 1, author: 'Circuit Bench', editor: 'wokwi', parts, connections, dependencies: {} };
  textDialog('Wokwi diagram.json', JSON.stringify(out, null, 2), 'diagram.json',
    `Paste this into diagram.json of a Wokwi project.${skipped ? ` ${skipped} part(s) Wokwi does not have (batteries, drivers, motors…) were left out.` : ''}`);
}

// ---------- menus ----------
function closeMenus() { $('exMenu').hidden = true; $('fileMenu').hidden = true; }
$('exBtn').onclick = (e) => { e.stopPropagation(); const m = $('exMenu'); const open = m.hidden; closeMenus(); m.hidden = !open; };
$('fileBtn').onclick = (e) => { e.stopPropagation(); const m = $('fileMenu'); const open = m.hidden; closeMenus(); m.hidden = !open; };
document.addEventListener('click', (e) => { if (!e.target.closest('.menu')) closeMenus(); });
$('exMenu').innerHTML = EXAMPLES.map((ex) => `<button data-ex="${ex.id}">${esc(ex.name)}</button>`).join('');
$('exMenu').onclick = (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  closeMenus();
  const ex = EXAMPLES.find((x) => x.id === b.dataset.ex);
  loadDoc({ ...clone(ex), exampleId: ex.id }, `Loaded “${ex.name}”. Press ▶ Run, or open Guide to build it step by step.`);
};
$('fileMenu').onclick = (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  closeMenus();
  const act = b.dataset.act;
  if (act === 'projects') { sideView = projectsHtml; renderSide(); if (narrow.matches) $('sidePanel').scrollIntoView({ behavior: 'smooth' }); }
  if (act === 'new') loadDoc({ name: 'New circuit', parts: [], wires: [] }, 'Empty board. Pick parts from the list.');
  if (act === 'open') pasteDialog('Open a project', 'project', 'A .json file saved from Circuit Bench.');
  if (act === 'save') textDialog('Project file', JSON.stringify(doc, null, 1), `${slug()}.json`, 'Download it, or copy it to keep it somewhere else. Open it again with File → Open.');
  if (act === 'wokwi-in') pasteDialog('Import from Wokwi', 'wokwi', 'Open your Wokwi project, copy the contents of diagram.json, and paste it here.');
  if (act === 'wokwi-out') exportWokwi();
  if (act === 'undo') undo();
  if (act === 'help') { select(null); tab = 'guide'; renderSide(); }
  if (act === 'keys') {
    sideView = () => `<h3>Keyboard shortcuts</h3><table>${[['Space', 'Run / pause'], ['Ctrl+Z', 'Undo'], ['Ctrl+Y or Ctrl+Shift+Z', 'Redo'], ['R', 'Rotate the selected part'], ['Ctrl+C / Ctrl+V', 'Copy and paste the selected part'], ['Ctrl+D', 'Duplicate the selected part'], ['Ctrl+S (in Code)', 'Compile and flash'], ['Delete / Backspace', 'Delete the selected part or wire'], ['Esc', 'Cancel the wire you are drawing, or clear the selection'], ['Double-click a wire', 'Add a bend'], ['Double-click a bend', 'Remove it'], ['Mouse wheel / pinch', 'Zoom']].map(([k, v]) => `<tr><th style="white-space:nowrap">${k}</th><td>${v}</td></tr>`).join('')}</table><div class="row" style="margin-top:8px"><button data-act="close-dlg">Close</button></div>`;
    tab = 'inspect';
    renderSide();
  }
};
$('projName').addEventListener('change', (e) => { doc.name = e.target.value; save(); });
$('runBtn').onclick = () => (running ? pauseRun() : startRun());
$('stopBtn').onclick = stopSim;
$('undoBtn').onclick = undo;
$('redoBtn').onclick = redo;
$('flowSel').onchange = () => { flowOffset.length = 0; renderWires(); updateRunBtn(); };

let toastTimer = 0;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}
function setHint() {
  const h = $('hint');
  if (draft) h.textContent = 'Click another pin to connect · click empty space to bend · Esc cancels';
  else if (running) h.textContent = 'Running · press buttons, turn knobs, flip switches · hover a pin to see its voltage';
  else if (!doc?.parts.length) h.textContent = 'Pick a part from the list to start, or open Examples';
  else if (sel?.kind === 'wire') h.textContent = 'Drag a round end onto another pin to rewire · drag the dots to bend · Del deletes';
  else h.textContent = 'Drag parts to move · click a pin to wire · click a wire to rewire it · wheel or pinch zooms';
}

// ---------- start ----------
buildShelf();
placeShelf();
applyView();
let saved = null;
try { saved = JSON.parse(store.get('circuit-bench-doc') || 'null'); } catch { saved = null; }
if (saved?.parts?.length) loadDoc(saved, null);
else loadDoc(clone(EXAMPLES.find((x) => x.id === 'blink')), null);
history.length = 0;
future.length = 0;
updateHistBtns();
updateRunBtn();

return {  };
})();
</script>
</body>
</html>
